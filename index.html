/* field switch */
function FieldInput({f,A,secId,set,designer,base,disabled,showErr}){
  const v=ansOf(A,secId,f.k); const lab=labelOf(f,A); const id=`f-${secId}-${f.k}`;
  const ch=val=>set(secId,f.k,val);
  const cur=(A.budget&&A.budget.currency)||'';
  const bad=showErr&&f.req&&!fieldAnswered(f,v,A);
  let input;
  switch(f.type){
    case 'text': case 'email': case 'tel': input=html`<input id=${id} type=${f.type} value=${v||''} placeholder=${f.ph||''} disabled=${disabled} onChange=${e=>ch(e.target.value)}/>`; break;
    case 'date': input=html`<input id=${id} type="date" value=${v||''} disabled=${disabled} onChange=${e=>ch(e.target.value)}/>`; break;
    case 'number': input=html`<input id=${id} type="number" min="0" inputMode="numeric" value=${v??''} disabled=${disabled} onChange=${e=>ch(e.target.value)}/>`; break;
    case 'money': input=html`<div className="row" style=${{'--g':'8px',flexWrap:'nowrap'}}><span className="mono muted" style=${{minWidth:'34px'}}>${cur||'—'}</span><input id=${id} type="number" min="0" inputMode="numeric" value=${v??''} disabled=${disabled} onChange=${e=>ch(e.target.value)}/></div>${v?html`<span className="help num">${money(v,cur)}</span>`:''}`; break;
    case 'textarea': input=html`<textarea id=${id} rows=${f.rows||3} value=${v||''} placeholder=${f.ph||''} disabled=${disabled} onChange=${e=>ch(e.target.value)}></textarea>`; break;
    case 'select': input=html`<select id=${id} value=${v||''} disabled=${disabled} onChange=${e=>ch(e.target.value)}><option value="">Select…</option>${f.opts.map(o=>html`<option key=${o}>${o}</option>`)}</select>`; break;
    case 'radio': input=html`<${Radio} opts=${f.opts} value=${v} onChange=${ch} disabled=${disabled} name=${lab}/>`; break;
    case 'chips': input=html`<${Chips} opts=${f.opts} value=${v} onChange=${ch} other=${f.other} disabled=${disabled}/>`; break;
    case 'measure': input=html`<${Measure} units=${f.units} value=${v} onChange=${ch} disabled=${disabled} designer=${designer}/>`; break;
    case 'scale': input=html`<${Scale} value=${v} onChange=${ch} min=${f.min} max=${f.max} disabled=${disabled}/>`; break;
    case 'tri': input=html`<${TriList} items=${f.items} value=${v} onChange=${ch} disabled=${disabled}/>`; break;
    case 'services': input=html`<${ServicesList} items=${f.items} value=${v} onChange=${ch} disabled=${disabled} designer=${designer}/>`; break;
    case 'rank': input=html`<${RankList} items=${typeof f.items==='function'?f.items(A):f.items} value=${v} onChange=${ch} disabled=${disabled}/>`; break;
    case 'spaces': input=html`<${SpacesEditor} value=${v} onChange=${ch} A=${A} disabled=${disabled} designer=${designer}/>`; break;
    case 'styles': input=html`<${StyleCards} value=${v} onChange=${ch} disabled=${disabled}/>`; break;
    case 'palettes': input=html`<${PalettePicker} value=${v} onChange=${ch} disabled=${disabled}/>`; break;
    case 'files': input=html`<${FileField} value=${v} onChange=${ch} base=${base} disabled=${disabled}/>`; break;
    case 'moodboard': input=html`<${Moodboard} value=${v} onChange=${ch} base=${base} disabled=${disabled}/>`; break;
    default: input=null;
  }
  const full=!f.half||['radio','chips','textarea','styles','palettes','spaces','files','moodboard','tri','services','rank','scale'].includes(f.type);
  const labelled=['text','email','tel','date','number','money','textarea','select'].includes(f.type);
  return html`<div className=${'field'+(full?' full':'')+(bad?' invalid':'')}>
    ${f.type!=='spaces'&&html`${labelled?html`<label htmlFor=${id}>${lab}${f.req?html`<span className="req" aria-label="required">*</span>`:''}${f.designerOnly?html` <span className="tag">Designer only</span>`:''}</label>`:html`<span className="flabel">${lab}${f.req?html`<span className="req" aria-label="required">*</span>`:''}${f.designerOnly?html` <span className="tag">Designer only</span>`:''}</span>`}`}
    ${f.help&&html`<span className="help">${f.help}</span>`}
    ${input}
    ${bad&&html`<span className="err">${f.type==='spaces'?'Add at least one space to continue.':f.type==='styles'?'Like at least one style to continue.':f.type==='rank'?'Confirm the order to continue.':'This is required.'}</span>`}
  </div>`;
}

/* ================= questionnaire ================= */
function Questionnaire({A,setA,designer,base,saveState,onSubmit,readOnly,submittedAt,studio}){
  const [step,setStep]=useState(0); const [showErr,setShowErr]=useState(false); const [confirm,setConfirm]=useState(false);
  const top=useRef();
  A=A||{};
  const set=(s,k,v)=>setA(n=>{ n=n||{}; n[s]=n[s]||{}; n[s][k]=v; return n; });
  const go=i=>{ setStep(i); setShowErr(false); setConfirm(false); setTimeout(()=>{ try{ top.current&&top.current.scrollIntoView({block:'start',behavior:'smooth'}); }catch(e){} },10); };
  const isReview=step===SECTIONS.length;
  const sec=SECTIONS[step];
  const stats=SECTIONS.map(s=>sectionStats(s,A,designer));
  const pct=completion(A,designer);
  const missingAll=stats.reduce((n,s)=>n+s.missingReq.length,0);
  const next=()=>{ if(!isReview&&!designer&&!readOnly&&stats[step].missingReq.length){ setShowErr(true); toast(`Please complete: ${stats[step].missingReq.join(', ')}`,true); return; } go(step+1); };
  return html`<div className="q" ref=${top}>
    <nav className="steps" aria-label="Brief sections">
      <div className="progress"><div className="spread small"><span className="muted">Completed</span><b className="num">${pct}%</b></div><div className="bar"><i style=${{width:pct+'%'}}></i></div></div>
      ${SECTIONS.map((s,i)=>html`<button key=${s.id} className=${'step'+(stats[i].done&&!stats[i].missingReq.length?' done':'')} aria-current=${step===i?'step':undefined} onClick=${()=>go(i)}>
        <span className="dot num">${stats[i].done&&!stats[i].missingReq.length&&step!==i?html`<${Icon} n="check" s="12"/>`:i+1}</span><span className="lbl">${s.short}</span></button>`)}
      <button className="step" aria-current=${isReview?'step':undefined} onClick=${()=>go(SECTIONS.length)}><span className="dot"><${Icon} n="eye" s="12"/></span><span className="lbl">Review${designer?'':' and submit'}</span></button>
    </nav>
    <div className="qcard">
      ${isReview?html`<${ReviewStep} A=${A} designer=${designer} stats=${stats} go=${go}/>`:html`
        <div className="qhead"><span className="eyebrow">Step ${step+1} of ${SECTIONS.length}</span><h2>${sec.title}</h2><p className="muted">${sec.intro}</p></div>
        <div className="fgrid">${sec.fields.filter(f=>(designer||!f.designerOnly)&&(!f.when||f.when(A))).map(f=>f.type==='info'
          ?html`<div className="full" key=${f.k} style=${{paddingTop:'6px'}}><span className="eyebrow">${f.text}</span></div>`
          :html`<${FieldInput} key=${f.k} f=${f} A=${A} secId=${sec.id} set=${set} designer=${designer} base=${base} disabled=${readOnly} showErr=${showErr}/>`)}</div>`}
      <div className="qfoot">
        <div className="row">${step>0&&html`<button className="btn" onClick=${()=>go(step-1)}><${Icon} n="back"/>Back</button>`}${!readOnly&&saveState&&html`<${SaveState} s=${saveState}/>`}</div>
        <div className="row">
          ${!isReview&&html`<button className="btn primary" onClick=${next}>${step===SECTIONS.length-1?'Review answers':'Save and continue'}<${Icon} n="next"/></button>`}
          ${isReview&&onSubmit&&!readOnly&&html`<div className="stack" style=${{'--g':'10px',alignItems:'flex-end'}}>
            ${missingAll>0&&!designer&&html`<span className="err">${missingAll} required answer${missingAll>1?'s are':' is'} missing. Use the list above to finish them.</span>`}
            <label className="check"><input type="checkbox" checked=${confirm} onChange=${e=>setConfirm(e.target.checked)}/><span>${designer?'Mark these responses as the submitted brief':'I confirm this information is accurate to the best of my knowledge and I am ready to send it to '+(studio||'the studio')+'.'}</span></label>
            <button className="btn accent" disabled=${!confirm||(missingAll>0&&!designer)} onClick=${()=>onSubmit()}><${Icon} n="send"/>${submittedAt?'Submit updated answers':designer?'Mark as submitted':'Submit my brief'}</button></div>`}
        </div>
      </div>
    </div></div>`;
}
function ReviewStep({A,designer,stats,go}){
  return html`<div className="stack" style=${{'--g':'22px'}}>
    <div className="qhead" style=${{marginBottom:0}}><span className="eyebrow">Review</span><h2>Check your answers</h2><p className="muted">Everything is saved as you go. Open any section to change it.</p></div>
    ${SECTIONS.map((s,i)=>{ const st=stats[i]; const fs=visibleFields(s,A,designer); return html`<div key=${s.id} className="stack" style=${{'--g':'10px',paddingBottom:'18px',borderBottom:'1px solid var(--line)'}}>
      <div className="spread"><h3>${s.title}</h3><div className="row"><span className="small muted num">${st.done} of ${st.total} answered</span><button className="btn sm" onClick=${()=>go(i)}><${Icon} n="edit"/>Edit</button></div></div>
      ${st.missingReq.length>0&&html`<div className="chk warn"><${Icon} n="alert"/><span>Still needed: ${st.missingReq.join(', ')}</span></div>`}
      <dl className="kv">${fs.filter(f=>fieldAnswered(f,ansOf(A,s.id,f.k),A)).map(f=>html`<${Fragment} key=${f.k}><dt>${labelOf(f,A)}</dt><dd>${summaryOf(f,ansOf(A,s.id,f.k),A)}</dd><//>`)}</dl></div>`; })}
  </div>`;
}
function summaryOf(f,v,A){
  const cur=(A.budget&&A.budget.currency)||'';
  switch(f.type){
    case 'chips': return chipsVal(v).join(', ');
    case 'measure': return html`${measureText(v)} <span className=${'tag '+(v.status==='verified'?'ok':'est')}>${v.status==='verified'?'verified':'estimate'}</span>`;
    case 'money': return money(v,cur);
    case 'scale': return `${v} of 5 (${v<=2?f.min.toLowerCase():v>=4?f.max.toLowerCase():'balanced'})`;
    case 'styles': return [ (v.like||[]).length?'Likes: '+v.like.map(id=>STYLES.find(s=>s.id===id)?.name).join(', '):'', (v.dislike||[]).length?'Not for: '+v.dislike.map(id=>STYLES.find(s=>s.id===id)?.name).join(', '):''].filter(Boolean).join(' · ');
    case 'palettes': return v.map(id=>PALETTES.find(p=>p.id===id)?.name).filter(Boolean).join(', ');
    case 'rank': return v.slice(0,5).map((x,i)=>`${i+1}. ${x}`).join('  ')+(v.length>5?' …':'');
    case 'spaces': return v.map(s=>s.name).join(', ');
    case 'tri': { const e=Object.keys(v).filter(k=>v[k]==='essential'), p=Object.keys(v).filter(k=>v[k]==='preferred'); return [e.length?`Essential: ${e.length}`:'',p.length?`Nice to have: ${p.length}`:''].filter(Boolean).join(' · '); }
    case 'services': { const c=k=>Object.values(v).filter(x=>x===k).length; return `${c('included')} included · ${c('excluded')} excluded · ${c('tbc')} to confirm`; }
    case 'files': return `${v.length} file${v.length>1?'s':''}`;
    case 'moodboard': return `${v.length} image${v.length>1?'s':''}`;
    default: return String(v);
  }
}

<script>
/* ================= brief generation ================= */
const MISSING='Not yet provided';

const art=w=>/^[aeiou]/i.test(w||'')?'an':'a';
function weeksBetween(a,b){ const d=(new Date(b)-new Date(a))/864e5; return isNaN(d)?null:Math.round(d/7); }
function generateBrief(p,prev){
  const A=p.answers||{}; const i=A.info||{}, pf=A.profile||{}, sp=(A.spaces&&A.spaces.list)||[], st=A.style||{}, b=A.budget||{}, site=A.site||{}, su=(A.sustain||{}), sc=(A.scope||{}), pr=A.priorities||{};
  const res=isRes(A), cur=b.currency;
  const S=[]; const add=(id,title,blocks)=>S.push({id,title,included:true,blocks:blocks.filter(Boolean)});
  const kv=rows=>({t:'kv',rows:rows.map(([k,v])=>[k,isEmpty(v)?MISSING:String(v)])});

  const likes=((st.styles&&st.styles.like)||[]).map(styleName), dislikes=((st.styles&&st.styles.dislike)||[]).map(styleName);
  const top3=(pr.rank||[]).slice(0,3); const atm=chipsVal(st.atmosphere);
  const checks=runChecks(A);

  // 1
  const work=i.workType?lc(i.workType):'interior design';
  let ov=`${i.projectName||'This project'} is ${art(work)} ${work} project${i.clientName?` for ${i.clientName}`:''}${i.propertyType?` at ${art(i.propertyType)} ${lc(i.propertyType)}`:''}${i.location?` in ${i.location}`:''}.`;
  if(i.projectType){ const t=i.projectType==='F&B'?'F&B':lc(i.projectType); ov+=` It is ${t==='F&B'?'an':art(t)} ${t} project.`; }
  if(i.startDate&&i.endDate) ov+=` Work is expected to start on ${fmtDate(i.startDate)} and complete by ${fmtDate(i.endDate)}.`;
  add('overview','Project overview',[P(ov),kv([['Project',i.projectName],['Reference',p.ref],['Client',i.clientName],['Email',i.email],['Phone',i.phone],['Project type',i.projectType],['Property type',i.propertyType],['Type of work',i.workType],['Location',i.location],['Address',[i.address,i.unit&&('Unit/floor '+i.unit)].filter(Boolean).join(', ')],['Designer',i.designer],['Expected start',fmtDate(i.startDate)],['Expected completion',fmtDate(i.endDate)]])]);
  // 2
  let prof='';
  if(res){ if(pf.occupants) prof=`The household is ${pf.occupants} ${+pf.occupants===1?'person':'people'}${chipsVal(pf.ageGroups).length?`, including ${joinList(chipsVal(pf.ageGroups).map(lc))}`:''}.`; if(pf.pets&&pf.pets!=='None') prof+=` There ${pf.pets==='Several pets'?'are several pets':'is a '+lc(pf.pets)} in the home${pf.petsDetail?` (${pf.petsDetail})`:''}.`; }
  else { const bits=[]; if(pf.occupants) bits.push(`${pf.occupants} regular users`); if(pf.staff) bits.push(`${pf.staff} staff`); if(pf.capacity) bits.push(`a customer capacity of ${pf.capacity}`); if(bits.length) prof=`The space serves ${joinList(bits)}.`; if(pf.hours) prof+=` Operating hours: ${pf.hours}.`; }
  add('client','Client profile',[P(prof||'The client profile has not yet been completed.'),res?kvK([['Occupants',pf.occupants],['Age groups',chipsVal(pf.ageGroups).join(', ')],['Occupations and routines',pf.routines],['Pets',pf.pets&&pf.pets!=='None'?[pf.pets,pf.petsDetail].filter(Boolean).join(' — '):pf.pets]])
    :kvK([['Regular users',pf.occupants],['Staff',pf.staff],['Customer capacity',pf.capacity],['Operating hours',pf.hours],['Customers',pf.demographics]])]);
  // 3
  const bg=[]; if(i.reason) bg.push(i.reason.trim().replace(/([^.!?])$/,'$1.'));
  if(i.workType||site.condition) bg.push(`The work is ${i.workType?`${art(i.workType)} ${lc(i.workType)}`:'an interior project'}${site.condition?`; the existing space is described as “${lc(site.condition)}”`:''}.`);
  if(pf.future) bg.push(`Looking ahead: ${pf.future.trim()}`);
  add('background','Project background',[P(bg.join(' ')||'The background to the project has not yet been described.'),kvK([['Existing furniture and fixtures',site.existing]])]);
  // 4
  const obj=[];
  if(top3.length) obj.push(`Prioritise ${joinList(top3.map(lc))}, in that order, when design decisions involve trade-offs.`);
  if(likes.length) obj.push(`Develop a design direction informed by ${joinList(likes)}${dislikes.length?`, avoiding references associated with ${joinList(dislikes)}`:''}.`);
  if(atm.length) obj.push(`Create spaces that feel ${joinList(atm.map(lc))}.`);
  if(sp.length) obj.push(`Resolve the functional requirements of ${sp.length} space${sp.length>1?'s':''}: ${joinList(sp.map(s=>s.name))}.`);
  if(b.total) obj.push(`Deliver the agreed scope within a total budget of ${money(b.total,cur)}${b.flexibility?` (${lc(b.flexibility)})`:''}.`);
  if(pr.nonneg) obj.push(`Meet the client’s non-negotiables: ${pr.nonneg.trim()}`);
  add('objectives','Project objectives',[P('These objectives are drawn directly from the client’s responses.'),obj.length?{t:'list',items:obj}:P('Objectives will be confirmed once the client’s priorities have been recorded.')]);
  // 5
  add('lifestyle','User and lifestyle analysis',[res?kvK([['Lifestyle',chipsVal(pf.lifestyle).join(', ')],['Hobbies and activities',pf.hobbies],['Working from home',pf.wfh&&pf.wfh!=='No'?[pf.wfh,pf.wfhDetail].filter(Boolean).join(' — '):pf.wfh],['Entertaining',pf.entertaining],['Household requirements',pf.requirements],['Storage needs',pf.storage],['Special requirements',pf.special],['Future requirements',pf.future]])
    :kvK([['Business activities',pf.activities],['Customers',pf.demographics],['Business requirements',pf.requirements],['Storage needs',pf.storage],['Special requirements',pf.special],['Future requirements',pf.future]]) || P('Lifestyle and use information has not yet been provided.')]);
  // 6
  add('spaces','Space and functional requirements',sp.length?[P(`${sp.length} space${sp.length>1?'s are':' is'} included in this brief. Sizes marked as estimates must be verified on site.`),
    {t:'table',head:['Space','Approx. size','Users','Key activities','Privacy'],rows:sp.map(s=>[s.name,(s.dims&&(s.dims.l||s.dims.w))?`${s.dims.l||'?'} × ${s.dims.w||'?'} m${s.dims.status==='verified'?'':' (est.)'}`:'—',s.users||'—',s.activities||'—',s.privacy||'—'])}]:[P('No spaces have been listed yet.')]);
  // 7
  const rooms=[]; sp.forEach(s=>{ rooms.push({t:'h',text:s.name}); const r=kvK([['Approximate size',(s.dims&&(s.dims.l||s.dims.w))?`${s.dims.l||'?'} × ${s.dims.w||'?'} m — ${s.dims.status==='verified'?'verified on site':'estimate, to verify on site'}`:''],...ROOM_FIELDS.map(([k,l])=>[l,s[k]])]); rooms.push(r||P('No requirements recorded for this space yet.')); });
  add('rooms','Room-by-room requirements',rooms.length?rooms:[P('Room-by-room requirements will follow once spaces are listed.')]);
  // 8
  const dec=+st.decoration; const decT=dec?['very minimal','restrained','balanced','richly layered','highly layered and collected'][dec-1]:'';
  let sd=''; if(likes.length) sd=`The client is drawn to ${joinList(likes)}.`; if(dislikes.length) sd+=` They do not want ${joinList(dislikes)}.`; if(decT) sd+=` A ${decT} level of decoration is preferred.`; if(st.lighting) sd+=` The preferred lighting atmosphere is ${lc(st.lighting)}.`;
  const mood=(st.moodboard||[]);
  add('style','Design style and concept direction',[P(sd||'Style preferences have not yet been recorded.'),st.feeling?{t:'quote',text:st.feeling}:null,
    kvK([['Preferred styles',likes.join(', ')],['Styles to avoid',dislikes.join(', ')],['Other style notes',st.styleOther],['Furniture style',chipsVal(st.furniture).join(', ')],['Atmosphere',atm.join(', ')],['Decoration level',dec?`${dec} of 5 — ${decT}`:'']]),
    mood.length?{t:'images',items:mood.map(m=>({ref:m.ref,caption:[m.caption,(m.tags||[]).join(', '),m.comment].filter(Boolean).join(' — ')}))}:null]);
  // 9
  const pals=(st.palettes||[]).map(id=>PALETTES.find(x=>x.id===id)).filter(Boolean);
  add('colour','Colour and material preferences',[pals.length?{t:'swatches',items:pals.map(x=>({name:x.name,c:x.c}))}:null,
    kvK([['Preferred palettes',pals.map(x=>x.name).join(', ')],['Colours to avoid',chipsVal(st.avoidColours).join(', ')],['Preferred materials and textures',chipsVal(st.materials).join(', ')]])||P('Colour and material preferences have not yet been recorded.')]);
  // 10
  const bn=budgetNums(b); const inc=chipsVal(b.includes); const exc=INCLUDES.filter(x=>!inc.includes(x));
  const brows=[['Interior design fee','designFee'],['Construction and renovation','construction'],['Furniture and equipment','furniture'],['Lighting','lighting'],['Decoration and accessories','decoration'],['Custom furniture and joinery','customFurniture'],['Contingency allowance','contingency']].map(([l,k])=>[l,b[k]?money(b[k],cur):'—',b[k]&&b.total?Math.round(b[k]/b.total*100)+'%':'—']);
  if(bn.count) brows.push(['Breakdown total',money(bn.sum,cur),b.total?Math.round(bn.sum/b.total*100)+'%':'—']);
  add('budget','Budget allocation and expectations',[kv([['Currency',cur],['Total estimated budget',money(b.total,cur)],['Flexibility',b.flexibility]]),
    {t:'table',head:['Budget line','Amount','Share of total'],rows:brows},
    inc.length?P(`The stated total includes ${joinList(inc.map(lc))}.${exc.length?` It does not include ${joinList(exc.map(lc))}; these are outside the budget unless agreed otherwise.`:''}`):P('The client has not yet confirmed what the total budget includes.'),
    kvK([['Priority areas for investment',b.invest],['Areas to save',b.save]]),
    ...checks.filter(c=>c.cat==='Budget').map(c=>({t:'note',kind:'check',text:c.t}))]);
  // 11
  const files=(site.files||[]);
  add('site','Site conditions',[kv([['Floor area',est(site.floorArea)],['Ceiling height',est(site.ceiling)],['Number of floors',site.floors],['Building condition',site.condition],['Natural light',[site.daylight,site.orientation&&site.orientation!=='Not sure'?`main windows face ${lc(site.orientation)}`:''].filter(Boolean).join('; ')]]),
    kvK([['Structural restrictions',site.structure],['Walls and partitions',site.walls],['Doors and windows',site.openings],['Ventilation and air-conditioning',site.ventilation],['Plumbing and electrical',site.services],['Site access and deliveries',site.access],['Building rules and management requirements',site.regulations],['Measurement and mark-up notes',site.markup]]),
    files.length?{t:'table',head:['Document','Type','Note'],rows:files.map(f=>[f.name,(f.kind||'').toUpperCase(),f.note||'—'])}:P('No plans, photographs or site documents have been uploaded yet.'),
    site.verify?{t:'list',title:'To verify on site',items:site.verify.split(/\n+/).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,''))}:null]);
  // 12
  const si=su.items||{}; const ess=SUSTAIN.filter(x=>si[x]==='essential'), pre=SUSTAIN.filter(x=>si[x]==='preferred'), na=SUSTAIN.filter(x=>si[x]==='na');
  add('sustain','Sustainability and accessibility considerations',(ess.length||pre.length)?[{t:'table',head:['Consideration','Priority'],rows:[...ess.map(x=>[x,'Essential']),...pre.map(x=>[x,'Nice to have'])]},na.length?P(`Not relevant at this stage: ${joinList(na.map(lc))}.`):null,P(su.notes)]:[P('Sustainability, comfort and accessibility priorities have not yet been recorded.'),P(su.notes)]);
  // 13
  const sv=sc.items||{}; const sIn=SERVICES.filter(x=>sv[x]==='included'), sEx=SERVICES.filter(x=>sv[x]==='excluded'), sTbc=SERVICES.filter(x=>sv[x]==='tbc');
  add('scope','Project scope and deliverables',(sIn.length||sEx.length||sTbc.length)?[{t:'table',head:['Service','Status'],rows:[...sIn.map(x=>[x,'Included']),...sTbc.map(x=>[x,'To be confirmed']),...sEx.map(x=>[x,'Excluded'])]},P(sc.notes)]:[P('The scope of services has not yet been confirmed.'),P(sc.notes)]);
  // 14
  const wk=i.startDate&&i.endDate?weeksBetween(i.startDate,i.endDate):null;
  const appr=events(p,null).approval;
  add('timeline','Timeline and milestones',[wk!=null&&wk>0?P(`The expected programme runs about ${wk} weeks, from ${fmtDate(i.startDate)} to ${fmtDate(i.endDate)}.`):P('Start and completion dates are still to be confirmed.'),
    {t:'table',head:['Milestone','Date','Status'],rows:[['Brief issued to client',p.issued?fmtDate(p.issued.at):'—',p.issued?`Version ${p.issued.version}`:'Pending'],['Brief approved by client','—','Pending'],['Expected start',i.startDate?fmtDate(i.startDate):'To be confirmed',''],['Expected completion',i.endDate?fmtDate(i.endDate):'To be confirmed','']]},
    sIn.length?P(`Dates for the included design stages (${joinList(sIn.slice(0,6).map(lc))}${sIn.length>6?' and others':''}) will be agreed after the brief is approved.`):null]);
  // 15
  add('priorities','Key priorities',[pr.rank&&pr.rank.length?{t:'list',ordered:true,items:pr.rank}:P('The client has not yet ranked their priorities.'),kvK([['Essential requirements',pr.essential],['Nice-to-have features',pr.preferred],['Non-negotiables',pr.nonneg],['Design elements to avoid',pr.avoid],['Decision-makers and approvals',pr.decision],['Communication',chipsVal(pr.comms).join(', ')],['Update frequency',pr.updates]])]);
  // 16
  const risks=[]; if(site.structure) risks.push(`Structure: ${site.structure}`); if(site.regulations) risks.push(`Building rules: ${site.regulations}`); if(site.access) risks.push(`Access and deliveries: ${site.access}`); if(pr.challenges) risks.push(`Known challenges: ${pr.challenges}`); if(b.flexibility==='Fixed — cannot go over') risks.push('The budget is fixed and cannot be exceeded.');
  add('risks','Project constraints and risks',[risks.length?{t:'list',items:risks}:P('No constraints have been stated yet.'),...checks.filter(c=>c.cat!=='Budget'&&c.lv==='warn').map(c=>({t:'note',kind:'check',text:c.t}))]);
  // 17
  const out=outstanding(A);
  add('outstanding','Outstanding information',[out.length?P(`${out.length} item${out.length>1?'s':''} still need${out.length>1?'':'s'} to be provided, confirmed or verified before design development begins.`):P('All key information has been provided.'),out.length?{t:'table',head:['Section','Item','Status'],rows:out.map(o=>[o.sec,o.t,o.kind])}:null]);
  // 18
  const sug=[]; const ag=chipsVal(pf.ageGroups);
  if(res&&['A few days a week','Full-time'].includes(pf.wfh)) sug.push('Consider acoustic separation and a dedicated, well-lit work zone for regular home working.');
  if(res&&pf.pets&&pf.pets!=='None') sug.push('Specify durable, easily cleaned finishes and fabrics that suit life with pets.');
  if(ag.includes('Older adults')||si['Age-friendly design']==='essential') sug.push('Allow for age-friendly details, such as level thresholds, higher lighting levels and supportive seating.');
  if(ag.includes('Babies and toddlers')||ag.includes('Children')) sug.push('Plan child-safe details and robust surfaces in shared spaces.');
  if(['Limited','Very little'].includes(site.daylight)) sug.push('Daylight is limited: lighter surfaces and a layered lighting scheme could help the space feel brighter.');
  if(['West','South-west'].includes(site.orientation)) sug.push('The main windows face west: plan for afternoon heat and glare in the choice of shading and window treatments.');
  if(pf.storage) sug.push('Integrate storage early in the space plan to meet the stated storage needs.');
  if(res&&['Regularly','Often host large groups'].includes(pf.entertaining)) sug.push('Plan flexible seating and generous circulation for regular entertaining.');
  if(/shrine|prayer|altar|buddha|spirit house/i.test([pf.special,pf.requirements,chipsVal(pf.lifestyle).join(' ')].join(' '))||chipsVal(pf.lifestyle).includes('Daily prayer or meditation')) sug.push('Agree the position, height and orientation of the shrine or prayer space with the client early, as these often follow specific customs.');
  if(!res&&pf.capacity) sug.push(`Test layouts against the stated capacity of ${pf.capacity}, including circulation at peak times.`);
  if(top3.includes('Brand identity')) sug.push('Translate the brand identity into materials, colour and signage from the first concept.');
  if(top3.includes('Maintenance')) sug.push('Favour low-maintenance materials and finishes in high-use areas.');
  if(out.some(o=>o.kind==='Verify on site')) sug.push('Confirm all estimated dimensions at the site survey before space planning is finalised.');
  add('considerations','Initial design considerations',[P('The suggestions below are generated from the client’s answers to support the designer’s review. They are not confirmed design decisions.'),sug.length?{t:'list',items:sug,suggest:true}:P('No suggestions at this stage.')]);
  // 19
  add('approval','Client approval',[P('By approving this brief, the client confirms that it reflects their requirements, priorities and budget expectations at the date of issue, and that the outstanding items listed above will be resolved as the project develops. Changes after approval will be recorded as a new version.'),{t:'sign'}]);

  // keep designer edits that should survive regeneration
  if(prev&&prev.sections){
    const byId=Object.fromEntries(prev.sections.map(s=>[s.id,s]));
    S.forEach(s=>{ const o=byId[s.id]; if(!o) return; s.included=o.included!==false; if(o.titleEdited){ s.title=o.title; s.titleEdited=true; } const mine=(o.blocks||[]).filter(x=>x.mine); s.blocks=[...s.blocks,...mine]; });
    const order=prev.sections.map(s=>s.id); const custom=prev.sections.filter(s=>s.custom);
    S.push(...custom); S.sort((a,b)=>{ const x=order.indexOf(a.id), y=order.indexOf(b.id); return (x<0?999:x)-(y<0?999:y); });
  }
  return {generatedAt:now(),sections:S};
}

/* ================= brief — HTML document view ================= */
function DocImg({item}){ const src=useThumb(item.ref); return html`<figure><div className="mimg">${src?html`<img src=${src} alt=${item.caption||''}/>`:''}</div>${item.caption&&html`<figcaption>${item.caption}</figcaption>`}</figure>`; }
function BlockView({b}){
  switch(b.t){
    case 'p': return b.text?html`<p>${b.text}</p>`:null;
    case 'h': return html`<h4>${b.text}</h4>`;
    case 'quote': return html`<p style=${{fontFamily:'var(--font-d)',fontSize:'18px',color:'var(--fg)'}}>“${b.text}”</p>`;
    case 'list': { const T=b.ordered?'ol':'ul'; return html`<div className="stack" style=${{'--g':'6px'}}>${b.title&&html`<h4>${b.title}</h4>`}<${T} style=${{margin:0,paddingLeft:'20px',display:'flex',flexDirection:'column',gap:'4px'}}>${b.items.map((x,i)=>html`<li key=${i}>${x}</li>`)}<//>${b.suggest&&html`<span className="tag ai" style=${{alignSelf:'flex-start'}}>Suggestion — for designer review</span>`}</div>`; }
    case 'kv': return html`<div className="tbl-wrap"><table className="tbl"><tbody>${b.rows.map(([k,v],i)=>html`<tr key=${i}><td className="k">${k}</td><td className=${v===MISSING?'missing':''}>${v}</td></tr>`)}</tbody></table></div>`;
    case 'table': return html`<div className="tbl-wrap"><table className="tbl"><thead><tr>${b.head.map(h=>html`<th key=${h}>${h}</th>`)}</tr></thead><tbody>${b.rows.map((r,i)=>html`<tr key=${i}>${r.map((c,j)=>html`<td key=${j}>${c}</td>`)}</tr>`)}</tbody></table></div>`;
    case 'note': { const lab={observation:'Designer observation',recommendation:'Designer recommendation',ai:'AI-assisted summary — not a confirmed decision',check:'Check',paragraph:''}[b.kind]; if(b.kind==='paragraph') return html`<p>${b.text}</p>`; return html`<div className=${'dnote'+(b.kind==='ai'||b.kind==='check'?' ai':'')}><div className="eyebrow" style=${{marginBottom:'3px'}}>${lab}</div>${b.text}</div>`; }
    case 'images': return b.items.length?html`<div className="dimgs">${b.items.map(it=>html`<${DocImg} key=${it.ref} item=${it}/>`)}</div>`:null;
    case 'swatches': return html`<div className="palettes">${b.items.map(x=>html`<div key=${x.name} className="palette" style=${{cursor:'default'}}><div className="sw">${x.c.map(c=>html`<i key=${c} style=${{background:c}}></i>`)}</div><span>${x.name}</span></div>`)}</div>`;
    case 'sign': return html`<div className="sign"><div>Client signature, name and date</div><div>Designer signature, name and date</div></div>`;
    default: return null;
  }
}
function BriefDoc({brief,project,settings,version,approval}){
  const i=(project.answers&&project.answers.info)||{};
  const secs=(brief.sections||[]).filter(s=>s.included!==false);
  return html`<article className="doc">
    <header className="doc-cover">
      <div className="spread"><div className="row"><${Mark} settings=${settings}/><div><div style=${{fontWeight:600}}>${settings.studioName}</div><div className="small muted">Interior design brief</div></div></div>
        <div className="small muted mono" style=${{textAlign:'right'}}>${project.ref}<br/>${version?`Version ${version.n} · ${fmtDate(version.at)}`:'Working draft'}</div></div>
      <span className="eyebrow">Interior Design Project Brief</span>
      <h1>${i.projectName||'Untitled project'}</h1>
      <dl className="kv"><dt>Client</dt><dd>${i.clientName||MISSING}</dd><dt>Location</dt><dd>${i.location||MISSING}</dd><dt>Project type</dt><dd>${[i.projectType,i.propertyType].filter(Boolean).join(' · ')||MISSING}</dd><dt>Date of issue</dt><dd>${version?fmtDate(version.at):fmtDate(now())}</dd></dl>
      ${approval&&html`<div className=${'callout'+(approval.status==='approved'?'':' warn')}><span>${approval.status==='approved'?`Approved by ${approval.name} on ${fmtDate(approval.at)} (version ${approval.version})`:`Changes requested on ${fmtDate(approval.at)}: ${approval.note||''}`}</span></div>`}
    </header>
    ${secs.map((s,idx)=>html`<section className="doc-sec" key=${s.id}><h2><span className="mono num">${String(idx+1).padStart(2,'0')}</span>${s.title}</h2>${s.blocks.map((b,j)=>html`<${BlockView} key=${j} b=${b}/>`)}</section>`)}
    <p className="small muted" style=${{marginTop:'24px'}}>${settings.footer}</p>
  </article>`;
}
function Mark({settings,size}){
  const s=settings||{}; const ini=(s.studioName||'S').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function NewProject({settings,projects,onClose,onCreated}){
  const [f,setF]=useState({projectName:'',clientName:'',email:'',phone:'',projectType:'Residential',propertyType:'',location:'',stage:'created'});
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(false);
  const u=(k,v)=>setF(x=>({...x,[k]:v}));
  const create=async()=>{
    if(!f.projectName.trim()||!f.clientName.trim()){ setErr(true); return; }
    setBusy(true);
    const y=new Date().getFullYear(); const nums=(projects||[]).map(p=>+((p.ref||'').split('-').pop())||0); const n=Math.max(0,...nums)+1;
    const id=rid(10); const ref=`${settings.refPrefix||'ID'}-${y}-${String(n).padStart(3,'0')}`;
    const {stage,...info}=f;
    const doc={id,ref,createdAt:now(),updatedAt:now(),stage:stage==='enquiry'?'enquiry':'created',archived:false,answers:{info:{...info,designer:settings.designer||''}},notes:''};
    try{ await DB.doc(P.project(id)).set(doc); toast('Project created'); onCreated(id); }catch(e){ toast(errMsg(e),true); setBusy(false); }
  };
  return html`<${Modal} title="New project" onClose=${onClose} footer=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" disabled=${busy} onClick=${create}>${busy?'Creating…':'Create project'}</button>`}>
    <div className="fgrid">
      <div className=${'field full'+(err&&!f.projectName.trim()?' invalid':'')}><label htmlFor="np-name">Project name<span className="req">*</span></label><input id="np-name" type="text" value=${f.projectName} onChange=${e=>u('projectName',e.target.value)} placeholder="e.g. Kamayut townhouse renovation"/></div>
      <div className=${'field'+(err&&!f.clientName.trim()?' invalid':'')}><label htmlFor="np-client">Client’s full name<span className="req">*</span></label><input id="np-client" type="text" value=${f.clientName} onChange=${e=>u('clientName',e.target.value)}/></div>
      <div className="field"><label htmlFor="np-loc">Location</label><input id="np-loc" type="text" value=${f.location} onChange=${e=>u('location',e.target.value)} placeholder="City and country"/></div>
      <div className="field"><label htmlFor="np-email">Client email</label><input id="np-email" type="email" value=${f.email} onChange=${e=>u('email',e.target.value)}/></div>
      <div className="field"><label htmlFor="np-phone">Phone</label><input id="np-phone" type="tel" value=${f.phone} onChange=${e=>u('phone',e.target.value)}/></div>
      <div className="field full"><span className="flabel">Project type</span><${Radio} opts=${PROJECT_TYPES} value=${f.projectType} onChange=${v=>u('projectType',v)} name="Project type"/></div>
      <div className="field full"><span className="flabel">Property type</span><${Radio} opts=${PROPERTY_TYPES} value=${f.propertyType} onChange=${v=>u('propertyType',v)} name="Property type"/></div>
      <div className="field full"><span className="flabel">Starting stage</span><${Radio} opts=${['Enquiry','Project created']} value=${f.stage==='enquiry'?'Enquiry':'Project created'} onChange=${v=>u('stage',v==='Enquiry'?'enquiry':'created')} name="Stage"/><span className="help">Use Enquiry for a lead you have not agreed to take on yet.</span></div>
    </div>
    ${err&&html`<span className="err">Add a project name and the client’s name to continue.</span>`}
  <//>`;
}

}

function BlockEdit({b,onChange,onRemove,onMove}){

/* ================= designer: versions and approval ================= */
function Versions({p,setP,settings,claim,saveNow}){
  const vs=useCollection(P.versions(p.id));
  const [label,setLabel]=useState(''); const [view,setView]=useState(null); const [busy,setBusy]=useState(''); const [offline,setOffline]=useState(null);
  const list=(vs.docs||[]).slice().sort((a,b)=>b.n-a.n);
  const appr=events(p,claim).approval; const log=(claim?claim.approvalLog:(p.local&&p.local.approvalLog))||[];
  const saveVersion=async()=>{
    if(!p.brief){ toast('Generate the brief first.',true); return; }
    const n=Math.max(0,...list.map(v=>v.n||0),p.versionCount||0)+1;
    try{ await DB.doc(`${P.versions(p.id)}/v${n}`).set({n,label:label.trim()||`Version ${n}`,at:now(),brief:clone(p.brief)}); setP(x=>{ x.versionCount=n; return x; }); setLabel(''); toast(`Version ${n} saved`); }catch(e){ toast(errMsg(e),true); }
  };
  const issue=async v=>{
    setBusy('issue'+v.n);
    try{
      if(claim) await DB.doc(P.issued(p.id)).set({pid:p.id,ref:p.ref,version:v.n,label:v.label,at:now(),brief:v.brief,info:(p.answers&&p.answers.info)||{}});
      const {_id,...rest}=v; await DB.doc(`${P.versions(p.id)}/v${v.n}`).set({...rest,issuedAt:now()});
      setP(x=>{ x.issued={version:v.n,at:now()}; x.statusOverride=null; return x; }); await saveNow();
      toast(claim?`Version ${v.n} sent to the client for approval`:`Version ${v.n} issued. Record the client’s approval here when you receive it.`);
    }catch(e){ toast(errMsg(e),true); }
    setBusy('');
  };
  const pdf=async v=>{ setBusy('pdf'+v.n); try{ const a=appr&&appr.version===v.n?appr:null; const {blob,fname}=await exportBriefPdf({brief:v.brief,project:p,settings,version:v,approval:a}); await downloadBlob(fname,blob); }catch(e){ console.error(e); toast('The PDF could not be created.',true); } setBusy(''); };
  return html`<div className="wrap ov">
    <div className="stack" style=${{'--g':'18px'}}>
      <div className="panel panel-pad stack" style=${{'--g':'12px'}}><h3>Save a version</h3><p className="help">A version is a frozen copy of the brief. Issue a version to send it to the client for approval.</p>
        <div className="row"><input type="text" className="grow" placeholder=${`Label, e.g. “Draft for client review”`} value=${label} onChange=${e=>setLabel(e.target.value)} aria-label="Version label"/><button className="btn primary" disabled=${!p.brief} onClick=${saveVersion}>Save version</button></div></div>
      <div className="panel"><div className="panel-head"><h3>Versions</h3><span className="small muted">${list.length}</span></div>
        ${vs.docs===null?html`<div className="empty"><div className="spinner"></div></div>`:list.length===0?html`<div className="empty"><p>No versions saved yet.</p></div>`
        :list.map(v=>{ const isIssued=p.issued&&p.issued.version===v.n; const a=appr&&appr.version===v.n?appr:null; return html`<div key=${v.n} className="spread" style=${{padding:'14px 20px',borderBottom:'1px solid var(--line)'}}>
          <div className="stack" style=${{'--g':'3px'}}><div className="row"><b className="mono">v${v.n}</b><span>${v.label}</span>${isIssued&&!a&&html`<span className="pill s-wait">Awaiting approval</span>`}${a&&html`<span className=${'pill '+(a.status==='approved'?'s-ok':'s-rev')}>${a.status==='approved'?'Approved':'Changes requested'}</span>`}${v.issuedAt&&!isIssued&&html`<span className="tag">Issued earlier</span>`}</div><span className="small muted">Saved ${fmtDT(v.at)}${v.issuedAt?` · issued ${fmtDT(v.issuedAt)}`:''}</span></div>
          <div className="row"><button className="btn sm" onClick=${()=>setView(v)}><${Icon} n="eye"/>View</button><button className="btn sm" disabled=${!!busy} onClick=${()=>pdf(v)}><${Icon} n="download"/>${busy==='pdf'+v.n?'Building…':'PDF'}</button>
          ${!isIssued&&html`<button className="btn sm accent" disabled=${!!busy} onClick=${()=>issue(v)}><${Icon} n="send"/>${busy==='issue'+v.n?'Issuing…':claim?'Send for approval':'Issue'}</button>`}
          ${isIssued&&!claim&&!a&&html`<button className="btn sm" onClick=${()=>setOffline(v)}>Record approval</button>`}</div></div>`; })}
      </div>
    </div>
    <div className="stack" style=${{'--g':'18px'}}>
      <div className="panel panel-pad stack" style=${{'--g':'12px'}}><h3>Approval</h3>
        ${!p.issued?html`<p className="help">No version has been issued yet.</p>`:html`<dl className="kv"><dt>Issued</dt><dd>Version ${p.issued.version}, ${fmtDT(p.issued.at)}</dd><dt>Sent to</dt><dd>${claim?'Client portal':'Recorded by the studio (client not online)'}</dd>
          <dt>Decision</dt><dd>${appr&&appr.version===p.issued.version?(appr.status==='approved'?`Approved by ${appr.name}, ${fmtDT(appr.at)}`:`Changes requested, ${fmtDT(appr.at)}`):'Waiting for the client'}</dd></dl>`}
        ${appr&&appr.status==='changes'&&appr.version===(p.issued&&p.issued.version)&&html`<div className="chk warn"><${Icon} n="alert"/><span>${appr.note||'No note left.'}</span></div>`}
      </div>
      <div className="panel panel-pad stack" style=${{'--g':'10px'}}><h3>Revision history</h3>
        ${log.length===0?html`<p className="help">Client decisions will appear here.</p>`:html`<ol style=${{margin:0,paddingLeft:'18px',display:'flex',flexDirection:'column',gap:'8px'}} className="small">${log.slice().reverse().map((e,k)=>html`<li key=${k}><b>${e.status==='approved'?'Approved':'Changes requested'}</b> — v${e.version} · ${fmtDT(e.at)}${e.name?` · ${e.name}`:''}${e.offline?' · recorded by studio':''}${e.note?html`<div className="muted">“${e.note}”</div>`:''}</li>`)}</ol>`}</div>
    </div>
    ${view&&html`<${Modal} title=${`v${view.n} · ${view.label}`} wide=${true} onClose=${()=>setView(null)}><div style=${{margin:'-22px'}}><${BriefDoc} brief=${view.brief} project=${p} settings=${settings} version=${view} approval=${appr&&appr.version===view.n?appr:null}/></div><//>`}
    ${offline&&html`<${OfflineApproval} v=${offline} onClose=${()=>setOffline(null)} onSave=${(rec)=>{ setP(x=>{ const a={...rec,version:offline.n,at:now(),offline:true}; x.local={...(x.local||{}),approval:a,approvalLog:[...((x.local&&x.local.approvalLog)||[]),a]}; return x; }); setOffline(null); toast('Approval recorded'); }}/>`}
  </div>`;
}

/* ================= designer: invitation ================= */
function InviteDialog({p,setP,settings,claim,onClose}){
  const [busy,setBusy]=useState(false); const [confirmReset,setConfirmReset]=useState(false);
  const live=Auth.mode==='live';
  const write=async reset=>{
    setBusy(true);
    try{
      const sb=Auth.sb; const code=(!reset&&p.invite&&p.invite.code)||newCode();
      if(reset){ let r=await sb.from('invites').delete().eq('project_id',p.id); if(r.error) throw r.error; r=await sb.from('project_access').delete().eq('project_id',p.id); if(r.error) throw r.error; }
      const payload={pid:p.id,ref:p.ref,answers:stripDesigner(p.answers)};
      const {error}=await sb.from('invites').upsert({id:code,project_id:p.id,payload,updated_at:new Date().toISOString()}); if(error) throw error;
      setP(n=>{ n.invite={code,createdAt:(!reset&&n.invite&&n.invite.createdAt)||now(),updatedAt:now(),sentAt:reset?null:(n.invite&&n.invite.sentAt)||null}; return n; });
      toast(reset?'A new link was created. The old link no longer works.':p.invite?'Link updated':'Client link created');
    }catch(e){ toast(errMsg(e),true); }
    setBusy(false); setConfirmReset(false);
  };
  const link=p.invite?`${inviteBase()}#invite-${p.invite.code}`:'';
  const i=(p.answers&&p.answers.info)||{};
  const msg=link?`Dear ${i.clientName||'client'},\n\nThank you for choosing ${settings.studioName}. To help us understand your project, please complete your interior design brief online:\n\n${link}\n\nNo account or password is needed. Your answers save automatically, so you can stop and come back at any time on the same device. It takes about 20–30 minutes, and you can upload photos, plans and pictures you like.\n\nThis link is private to you, so please don’t share it.\n\nKind regards,\n${settings.designer||settings.studioName}`:'';
  if(!live) return html`<${Modal} title="Invite the client" onClose=${onClose} footer=${html`<button className="btn" onClick=${onClose}>Close</button>`}>
    <p>Client links work once the app is connected to your free Supabase database. The setup guide (README) walks you through it.</p>
    <p className="muted">Until then, you can fill in the brief with your client yourself in the <b>Brief responses</b> tab.</p><//>`;

function ClientProject({pid,settings,issuedDoc,onBack}){

  return html`<div>

/* ================= connection check (built-in setup helper) ================= */
function normalizeUrl(u){
  u=(u||'').trim().replace(/^['"]+|['"]+$/g,'');
  let m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]{20})/i); if(m) return `https://${m[1].toLowerCase()}.supabase.co`;
  if(/^[a-z0-9]{20}$/i.test(u)) return `https://${u.toLowerCase()}.supabase.co`;
  if(/^[a-z0-9-]+\.supabase\.co/i.test(u)) u='https://'+u;
  u=u.replace(/^http:\/\//i,'https://');
  m=u.match(/^(https:\/\/[a-z0-9-]+\.supabase\.co)/i); if(m) return m[1].toLowerCase();
  return u.replace(/\/+$/,'');
}
const normalizeKey=k=>(k||'').trim().replace(/^['"]+|['"]+$/g,'').replace(/\s+/g,'');
function jwtPayload(k){ try{ const p=k.split('.')[1]; return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(p.length/4)*4,'='))); }catch(e){ return null; } }
const refOf=u=>{ const m=(u||'').match(/^https:\/\/([a-z0-9-]+)\.supabase\.co$/); return m?m[1]:''; };
async function checkConnection(rawUrl,rawKey){
  const url=normalizeUrl(rawUrl), key=normalizeKey(rawKey); const checks=[];
  const add=(label,status,detail,fix)=>checks.push({label,status,detail,fix:fix||''});
  const done=()=>({url,key,checks,ok:checks.every(c=>c.status!=='bad'),formatOk:checks.length>=2&&checks[0].status==='ok'&&checks[1].status==='ok'});
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)){ add('Project URL','bad',url?`“${url}” doesn’t look like a Supabase Project URL.`:'No Project URL entered.','In Supabase, open Project Settings → Data API and copy the Project URL. It looks like https://abcdefghijklmnopqrst.supabase.co'); return done(); }
  add('Project URL','ok',url);
  let keyOk=true;
  if(!key){ add('Public key','bad','No key entered.','In Supabase, open Project Settings → API Keys and copy the Publishable key (or the “anon public” key under Legacy API keys).'); keyOk=false; }
  else if(/^sb_secret_/.test(key)){ add('Public key','bad','This is your SECRET key. It must never go on your website.','Use the Publishable key (starts with sb_publishable_) or the legacy “anon public” key (starts with eyJ).'); keyOk=false; }
  else if(/^eyJ/.test(key)){ const p=jwtPayload(key);
    if(!p){ add('Public key','bad','This key looks incomplete — part of it may be missing.','Copy the whole key again using the copy button next to it in Supabase.'); keyOk=false; }
    else if(p.role==='service_role'){ add('Public key','bad','This is the service_role (secret) key. It must never go on your website.','Use the “anon public” key instead.'); keyOk=false; }
    else if(p.ref&&refOf(url)&&p.ref!==refOf(url)){ add('Public key','bad',`This key belongs to a different Supabase project (${p.ref}), not ${refOf(url)}.`,'Copy the Project URL and the key from the same Supabase project.'); keyOk=false; }
    else add('Public key','ok','Legacy “anon public” key');
  } else if(/^sb_publishable_/.test(key)) add('Public key','ok','Publishable key');
  else { add('Public key','bad','This doesn’t look like a Supabase public key.','It should start with sb_publishable_ or eyJ. Copy it again from Project Settings → API Keys.'); keyOk=false; }
  if(!keyOk) return done();
  let st=null;
  try{
    const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});
    if(r.status===401||r.status===403){ add('Connection','bad','Supabase rejected this key.','Copy the key again, from the same project as the Project URL.'); return done(); }
    if(!r.ok){ add('Connection','bad',`Supabase answered with an error (${r.status}).`,'The project may be paused or still starting. Open your Supabase dashboard; if it offers “Restore project”, click it and wait a few minutes.'); return done(); }
    st=await r.json(); add('Connection','ok','Your website can reach your Supabase project.');
  }catch(e){ add('Connection','bad','Can’t reach this address.','Check the Project URL is exactly right. If it is, the project may be paused: open your Supabase dashboard and click “Restore project”.'); return done(); }
  const ext=(st&&st.external)||{};
  add('Studio sign-in (email)',ext.email===false?'bad':'ok',ext.email===false?'Email sign-in is switched off.':'Switched on.',ext.email===false?'Authentication → Sign In / Providers → Email → switch it on → Save.':'');
  add('Client links (anonymous sign-ins)',ext.anonymous_users?'ok':'bad',ext.anonymous_users?'Switched on.':'Switched off, so clients can’t open their links.',ext.anonymous_users?'':'Authentication → Sign In / Providers → switch on “Allow anonymous sign-ins” → Save.');
  try{
    const r=await fetch(url+'/rest/v1/rpc/studio_ready',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:'{}'});
    if(r.status===404){ add('Database','bad','The database hasn’t been set up yet.','Supabase → SQL Editor → New query → paste all of schema.sql → Run.'); }
    else if(!r.ok){ const t=await r.text(); add('Database','bad',`The database answered with an error (${r.status}).`,'Run schema.sql again in the SQL Editor. Technical detail: '+t.slice(0,160)); }
    else { const ready=await r.json(); add('Database','ok','Set up.');
      add('Studio login',ready===true?'ok':'bad',ready===true?'Your studio login is set up.':'No studio login has been set up yet.',ready===true?'':'Authentication → Users → Add user → Create new user (tick “Auto Confirm User”). Then run schema.sql again — it makes that login the studio account.'); }
  }catch(e){ add('Database','bad','Couldn’t check the database.','Wait a minute and press “Check again”.'); }
  return done();
}
function SetupCheck({settings}){
  const [url,setUrl]=useState(isConfigured()?CFG.supabaseUrl:''); const [key,setKey]=useState(isConfigured()?CFG.supabaseAnonKey:'');
  const [res,setRes]=useState(null); const [busy,setBusy]=useState(false);
  const [em,setEm]=useState(''); const [np,setNp]=useState('');
  const run=async()=>{ setBusy(true); try{ setRes(await checkConnection(url,key)); }catch(e){ setRes({checks:[{label:'Check',status:'bad',detail:String((e&&e.message)||e),fix:''}],ok:false}); } setBusy(false); };
  useEffect(()=>{ if(url&&key) run(); },[]);
  const cfgText=res&&res.formatOk?`window.BRIEF_CONFIG = {\n  supabaseUrl: '${res.url}',\n  supabaseAnonKey: '${res.key}'\n};\n`:'';
  const same=res&&res.formatOk&&isConfigured()&&normalizeUrl(CFG.supabaseUrl)===res.url&&normalizeKey(CFG.supabaseAnonKey)===res.key;
  const q=s=>s.replace(/'/g,"''"); const e2=q(em.trim().toLowerCase());
  const resetSql=em.trim()&&np?`update auth.users\nset encrypted_password = extensions.crypt('${q(np)}', extensions.gen_salt('bf')),\n    email_confirmed_at = coalesce(email_confirmed_at, now())\nwhere lower(email) = '${e2}';\n\ninsert into public.admins (user_id)\nselect id from auth.users where lower(email) = '${e2}'\non conflict do nothing;\n`:'';
  const icon=s=>s==='ok'?'check':'alert';
  return html`<${Fragment}><${TopBar} settings=${settings} role="Setup"/>
    <div className="wrap" style=${{maxWidth:'820px',paddingBlock:'28px 60px'}}><div className="stack" style=${{'--g':'18px'}}>
      <div className="stack" style=${{'--g':'6px'}}><span className="eyebrow">Setup</span><h1>Connection check</h1>
        <p className="muted">Paste your Supabase details to test them. This page doesn’t save anything — it checks the details and gives you the exact text for <span className="mono">config.js</span>.</p></div>
      <div className="panel panel-pad stack" style=${{'--g':'16px'}}>
        <div className="field"><label htmlFor="su-url">Project URL</label><span className="help">Supabase → Project Settings → Data API. Looks like https://abcdefghijklmnopqrst.supabase.co</span><input id="su-url" type="url" spellCheck="false" value=${url} onChange=${e=>setUrl(e.target.value)} placeholder="https://….supabase.co"/></div>
        <div className="field"><label htmlFor="su-key">Public key</label><span className="help">Supabase → Project Settings → API Keys. Use the Publishable key (sb_publishable_…) or, under Legacy API keys, the anon public key (eyJ…). Never the secret key.</span><textarea id="su-key" rows="3" spellCheck="false" className="mono" value=${key} onChange=${e=>setKey(e.target.value)} placeholder="sb_publishable_… or eyJ…"></textarea></div>
        <button className="btn primary" style=${{alignSelf:'flex-start'}} disabled=${busy||!url||!key} onClick=${run}>${busy?'Checking…':res?'Check again':'Check connection'}</button>
      </div>
      ${res&&html`<div className="panel panel-pad stack" style=${{'--g':'10px'}}><div className="spread"><h3>Results</h3>${res.ok?html`<span className="pill s-ok">All good</span>`:html`<span className="pill s-rev">Needs fixing</span>`}</div>
        <div className="checks">${res.checks.map((c,k)=>html`<div key=${k} className=${'chk '+(c.status==='ok'?'ok':'warn')}><${Icon} n=${icon(c.status)}/><div className="stack" style=${{'--g':'3px'}}><span><b>${c.label}:</b> ${c.detail}</span>${c.fix&&html`<span><b>Fix:</b> ${c.fix}</span>`}</div></div>`)}</div></div>`}
      ${res&&res.formatOk&&html`<div className="panel panel-pad stack" style=${{'--g':'12px'}}>
        ${same?html`<div className="callout"><span>Your website is already using these details.</span></div>`:html`<${Fragment}><h3>Put these details on your website</h3>
          <ol style=${{margin:0,paddingLeft:'20px',display:'flex',flexDirection:'column',gap:'6px'}}>
            <li>On GitHub, open your repository, click <b>config.js</b>, then the <b>pencil icon</b> (Edit).</li>
            <li>Click inside the text, press <b>Ctrl + A</b> to select everything, then <b>Delete</b>.</li>
            <li>Click <b>Copy</b> below, then paste into GitHub with <b>Ctrl + V</b>.</li>
            <li>Click <b>Commit changes</b> (twice, if GitHub asks again).</li>
            <li>Wait 2 minutes, then reload your website with <b>Ctrl + F5</b>.</li></ol><//>`}
          <textarea readOnly rows="5" className="mono" value=${cfgText} style=${{fontSize:'12.5px'}} aria-label="config.js text"></textarea>
          <button className="btn sm" style=${{alignSelf:'flex-start'}} onClick=${()=>copyText(cfgText)}><${Icon} n="copy"/>Copy config.js text</button>
      </div>`}
      <div className="panel panel-pad stack" style=${{'--g':'12px'}}><h3>Can’t sign in? Set a new studio password</h3>
        <p className="small muted">Type the email of your studio login (exactly as shown in Supabase → Authentication → Users) and a new password. Copy the text it makes, then in Supabase open <b>SQL Editor → New query</b>, paste it and click <b>Run</b>. It also makes sure the login is the studio account.</p>
        <div className="fgrid"><div className="field"><label htmlFor="su-em">Studio email</label><input id="su-em" type="email" value=${em} onChange=${e=>setEm(e.target.value)}/></div>
          <div className="field"><label htmlFor="su-np">New password</label><input id="su-np" type="text" autoComplete="off" value=${np} onChange=${e=>setNp(e.target.value)} placeholder="At least 8 characters"/></div></div>
        ${resetSql&&html`<textarea readOnly rows="9" className="mono" value=${resetSql} style=${{fontSize:'12.5px'}} aria-label="Password reset SQL"></textarea>
          <button className="btn sm" style=${{alignSelf:'flex-start'}} onClick=${()=>copyText(resetSql)}><${Icon} n="copy"/>Copy</button>
          <p className="help">After running it, Supabase should say “Success”. Then sign in with that email and the new password, typed by hand.</p>`}
      </div>
      <button className="btn" style=${{alignSelf:'flex-start'}} onClick=${()=>setHash('')}><${Icon} n="back"/>Back to the app</button>
    </div></div><//>`;
}

/* ================= root ================= */
function SignIn({settings}){
  const [email,setEmail]=useState(''); const [pw,setPw]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const go=async e=>{ e.preventDefault(); setBusy(true); setErr('');
    try{ const {error}=await Auth.sb.auth.signInWithPassword({email:email.trim(),password:pw}); if(error){ const m=error.message||''; setErr(/invalid login credentials/i.test(m)?'That email and password don’t match a login in this Supabase project. Check the email is exactly as listed in Supabase → Authentication → Users, or set a new password with the connection check below.':/email not confirmed/i.test(m)?'This account hasn’t been confirmed. In Supabase → Authentication → Users, open the user and confirm them (or recreate them with “Auto Confirm User” ticked).':errMsg(error)); setBusy(false); } }
    catch(x){ setErr(errMsg(x)); setBusy(false); } };
  return html`<${Fragment}><${TopBar} settings=${settings} role="Sign in"/>
    <div className="center-screen"><form className="center-card" onSubmit=${go}>
      <span className="eyebrow">${settings.studioName}</span><h1>Studio sign in</h1>
      <div className="panel panel-pad stack" style=${{'--g':'16px'}}>
        <div className="field"><label htmlFor="si-email">Email</label><input id="si-email" type="email" autoComplete="username" value=${email} onChange=${e=>setEmail(e.target.value)}/></div>
        <div className="field"><label htmlFor="si-pw">Password</label><input id="si-pw" type="password" autoComplete="current-password" value=${pw} onChange=${e=>setPw(e.target.value)}/></div>
        ${err&&html`<span className="err" role="alert">${err}</span>`}
        <button className="btn primary" type="submit" disabled=${busy||!email||!pw} style=${{alignSelf:'flex-start'}}>${busy?'Signing in…':'Sign in'}</button>
      </div>
      <p className="help">Are you a client? You don’t need an account — open the private link your designer sent you.</p>
      <div className="row" style=${{'--g':'8px'}}><button type="button" className="btn sm" onClick=${()=>setHash('setup')}><${Icon} n="gear"/>Trouble signing in? Run the connection check</button><span className="small muted mono">${refOf(normalizeUrl(CFG.supabaseUrl))}.supabase.co</span></div>
    </form></div><//>`;
}
function NotStudio({settings}){
  return html`<${Fragment}><${TopBar} settings=${settings} role="Signed in" onSignOut=${signOut}/>
    <div className="center-screen"><div className="center-card panel panel-pad"><h2>This isn’t a studio account</h2>
      <p className="muted">You’re signed in as <span className="mono">${Auth.email}</span>, but this account can’t open the studio dashboard.</p>
      <p className="muted small">To make this login the studio account, copy this line, then in Supabase open <b>SQL Editor → New query</b>, paste it and click <b>Run</b>. Then sign out and sign in again.</p>
      <${CopyBox} value=${`insert into public.admins (user_id) select id from auth.users where lower(email) = '${(Auth.email||'').toLowerCase().replace(/'/g,"''")}' on conflict do nothing;`} label="SQL"/>
      <button className="btn" style=${{alignSelf:'flex-start'}} onClick=${signOut}>Sign out</button></div></div><//>`;
}
function Root(){
  const [ready,setReady]=useState(false); const [ver,setVer]=useState(0); const hash=useHash();
  useEffect(()=>{ initBackend().then(()=>setReady(true),e=>{ console.error(e); Auth.mode='error'; Auth.error=errMsg(e); setReady(true); }); },[]);
  useEffect(()=>{ if(!ready||!Auth.sb) return; const {data}=Auth.sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'||ev==='USER_UPDATED') setTimeout(()=>refreshAuth().then(()=>setVer(v=>v+1)),0); }); return ()=>data.subscription.unsubscribe(); },[ready]);
  if(!ready) return html`<div className="center-screen"><div className="row muted"><div className="spinner"></div>Opening the studio…</div></div>`;
  if(Auth.mode==='error'&&hash==='setup') return html`<${Fragment}><${SetupCheck} settings=${withDefaults(null)}/><${Toasts}/><//>`;
  if(Auth.mode==='error') return html`<div className="center-screen"><div className="center-card panel panel-pad"><h2>The app can’t start</h2><p className="muted">${Auth.error}</p><div className="row"><button className="btn" onClick=${()=>location.reload()}>Reload</button><button className="btn" onClick=${()=>setHash('setup')}>Run the connection check</button></div></div></div>`;
  return html`<${Fragment}><${Main} key=${String(Auth.isAdmin)} ver=${ver}/><${Toasts}/><//>`;
}
function Main(){
  const hash=useHash();
  const designer=Auth.isAdmin;
  const [sRaw,setS,sSave]=useLiveDoc(designer?P.settings:null,600);
  const sView=useDocValue(!designer&&Auth.mode==='live'?P.settings:null);
  const settings=withDefaults(designer?sRaw:sView.data);
  useEffect(()=>{ document.title=`${settings.studioName} · Brief Studio`; },[settings.studioName]);
  if(hash==='setup') return html`<${SetupCheck} settings=${settings}/>`;
  const clientRoute=/^(invite|brief)-/.test(hash);
  if(clientRoute&&Auth.mode!=='live') return html`<${Fragment}><${TopBar} settings=${settings} role="Client portal"/><div className="center-screen"><div className="center-card panel panel-pad"><h2>Client links aren’t switched on yet</h2><p className="muted">This app is in demo mode. Client links start working once it is connected to Supabase — see the setup guide.</p><button className="btn" style=${{alignSelf:'flex-start'}} onClick=${()=>setHash('')}>Open the studio</button></div></div><//>`;
  if(clientRoute) return html`<${ClientApp} settings=${settings}/>`;
  if(designer) return html`<${DesignerApp} settings=${settings} setSettings=${setS} settingsSave=${sSave}/>`;
  if(Auth.session&&Auth.anon) return html`<${ClientApp} settings=${settings}/>`;
  if(Auth.session) return html`<${NotStudio} settings=${settings}/>`;
  return html`<${SignIn} settings=${settings}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
</script>
