<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mystic Nova Brief Studio</title>
<meta name="description" content="Interior design brief studio: client questionnaire, design brief generation, approval and PDF export.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23131714%22/%3E%3Ctext x=%2216%22 y=%2221.5%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2214%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EMN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet studio workspace — top bar, wide content column, document-like panels; drawing-office details in mono (refs, dimensions, status). */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#DBE1DA; --line-2:#C5CEC4;
  --fg:#131714; --fg-2:#3A433C; --muted:#68736A;
  --accent:#2C6646; --accent-ink:#FFFFFF; --accent-soft:#E0ECE3; --accent-line:#B9D3C1;
  --warn:#8E600C; --warn-soft:#F5ECD7; --bad:#A03A2B; --bad-soft:#F5E1DC; --info:#35567F; --info-soft:#E1E8F2;
  --font-d:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-s:6px;
  --t-xs:12px; --t-s:13px; --t-b:15px; --t-m:17px; --t-l:22px; --t-xl:30px; --t-xxl:40px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D110F; --surface:#141917; --sunk:#1A201D; --line:#252E29; --line-2:#334039;
  --fg:#E6EBE7; --fg-2:#C2CBC5; --muted:#8C978F;
  --accent:#86C29D; --accent-ink:#0D110F; --accent-soft:#1B2B22; --accent-line:#2F4A3A;
  --warn:#DFB15A; --warn-soft:#2B2416; --bad:#E58978; --bad-soft:#321C18; --info:#91B1DA; --info-soft:#19232F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D110F; --surface:#141917; --sunk:#1A201D; --line:#252E29; --line-2:#334039;
  --fg:#E6EBE7; --fg-2:#C2CBC5; --muted:#8C978F;
  --accent:#86C29D; --accent-ink:#0D110F; --accent-soft:#1B2B22; --accent-line:#2F4A3A;
  --warn:#DFB15A; --warn-soft:#2B2416; --bad:#E58978; --bad-soft:#321C18; --info:#91B1DA; --info-soft:#19232F;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:var(--t-b);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:500;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:var(--t-xl)} h2{font-size:var(--t-l)} h3{font-size:var(--t-m);font-weight:600} h4{font-size:var(--t-b);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-m);font-size:.86em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.small{font-size:var(--t-s)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:var(--g,16px)}
.row{display:flex;align-items:center;gap:var(--g,10px);flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{height:58px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:30px;height:30px;border-radius:5px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-d);font-weight:600;font-size:13px;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-name{font-family:var(--font-d);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:8px 12px;border-radius:var(--r-s);color:var(--fg-2);cursor:pointer;font-weight:500}
.nav button[aria-current="page"]{background:var(--sunk);color:var(--fg)}
.role{font-size:var(--t-xs);padding:4px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--warn);font-size:var(--t-s);border-bottom:1px solid var(--line)}
.banner .wrap{padding-block:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:var(--t-s);line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg-2)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:var(--t-xs)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg-2);flex:none}
.icon-btn:hover{border-color:var(--fg-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:20px}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;padding:3px 9px 3px 8px;border-radius:99px;background:var(--sunk);color:var(--fg-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.s-new{background:var(--info-soft);color:var(--info)}
.pill.s-wait{background:var(--warn-soft);color:var(--warn)}
.pill.s-work{background:var(--sunk);color:var(--fg-2)}
.pill.s-sub{background:var(--accent-soft);color:var(--accent)}
.pill.s-rev{background:var(--bad-soft);color:var(--bad)}
.pill.s-ok{background:var(--accent);color:var(--accent-ink)}
.pill.s-arch{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--fg-2)}
.tag.est{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.ai{background:var(--info-soft);color:var(--info)}

/* dashboard */
.page-head{padding-block:28px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;border:0;border-right:1px solid var(--line);background:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat:last-child{border-right:0}
.stat b{font-family:var(--font-d);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.25}
.stat[aria-pressed="true"]{background:var(--accent-soft)}
.stat[aria-pressed="true"] span{color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:16px}
.search{flex:1;min-width:200px;position:relative}
.toolbar .search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding-bottom:40px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;color:var(--fg)}
.pcard:hover{border-color:var(--line-2)}
.pcard-swatch{height:54px;display:flex}
.pcard-swatch i{flex:1}
.pcard-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.pcard h3{font-size:16px;font-weight:600}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--t-s)}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--fg)}

/* forms */
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=url],input:not([type]),select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:var(--t-b);line-height:1.4}
textarea{resize:vertical;min-height:44px}
select{max-width:100%}
.panel,.qcard{min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.flabel{font-weight:600;font-size:var(--t-s);color:var(--fg)}
.req{color:var(--bad);font-weight:600;margin-left:3px}
.help{font-size:var(--t-s);color:var(--muted)}
.err{font-size:var(--t-s);color:var(--bad)}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--bad)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}
.fgrid>.full{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:7px 12px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);cursor:pointer;font-size:var(--t-s);line-height:1.2}
.opt:hover{border-color:var(--fg-2)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:var(--t-xs);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.ess button[aria-pressed="true"][data-v="essential"]{background:var(--fg);color:var(--bg)}
.seg button[aria-pressed="true"][data-v="excluded"],.seg button[aria-pressed="true"][data-v="na"]{background:var(--sunk);color:var(--fg-2)}
.seg button[aria-pressed="true"][data-v="tbc"]{background:var(--warn-soft);color:var(--warn)}
.measure{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.measure input{width:130px;flex:none}
.measure select{width:auto;flex:none}
.scale{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scale button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.trilist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.trirow{display:flex;justify-content:space-between;gap:10px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trirow:last-child{border-bottom:0}
.trirow .grow{font-size:var(--t-s)}
.ranklist{display:flex;flex-direction:column;gap:6px;counter-reset:r}
.rankrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.rankrow .n{font-family:var(--font-m);font-size:12px;color:var(--muted);width:22px}
.rankrow:nth-child(-n+3) .n{color:var(--accent);font-weight:500}
.check{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s);cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}

/* questionnaire layout */
.q{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;cursor:pointer;text-align:left;font-size:var(--t-s);color:var(--fg-2)}
.step .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--font-m);font-size:11px;flex:none;background:var(--surface)}
.step.done .dot{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.step[aria-current="step"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.step[aria-current="step"] .dot{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,3vw,36px)}
.qhead{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:62ch}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.progress{display:flex;flex-direction:column;gap:6px;padding:10px 10px 14px}
.savestate{font-size:var(--t-xs);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savestate::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.savestate.saving::before{background:var(--warn)}
.savestate.error::before{background:var(--bad)}

/* spaces */
.space{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.space-head{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.space-head input{font-weight:600;border-color:transparent;background:transparent;padding:6px 8px;flex:1;min-width:140px}
.space-head input:hover{border-color:var(--line)}
.space-body{padding:4px 16px 18px;border-top:1px solid var(--line)}
.space-body .fgrid{margin-top:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .opt::before{content:"+ ";color:var(--muted)}

/* style cards */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.scard[data-s="like"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scard[data-s="dislike"]{opacity:.62}
.scard svg.v{display:block;width:100%;height:auto;aspect-ratio:16/10}
.scard-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.scard-b h4{font-size:14px}
.scard-b p{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1}
.scard-a{display:flex;gap:6px}
.scard-a button{flex:1;padding:6px;font-size:12px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);cursor:pointer}
.scard-a button[aria-pressed="true"].like{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scard-a button[aria-pressed="true"].dis{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.palette{border:1px solid var(--line);border-radius:var(--r-s);padding:0;background:var(--surface);cursor:pointer;overflow:hidden;text-align:left}
.palette .sw{display:flex;height:34px}
.palette .sw i{flex:1}
.palette span{display:block;padding:7px 10px;font-size:12.5px}
.palette[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.palette[aria-pressed="true"] span{color:var(--accent);font-weight:600}

/* files / moodboard */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-s);padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center;color:var(--muted);font-size:var(--t-s);background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filelist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.filerow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:var(--t-s);flex-wrap:wrap}
.filerow:last-child{border-bottom:0}
.ficon{width:40px;height:40px;border-radius:4px;background:var(--sunk);display:grid;place-items:center;font-family:var(--font-m);font-size:10px;color:var(--muted);overflow:hidden;flex:none}
.ficon img{width:100%;height:100%;object-fit:cover}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mitem{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.mimg{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px;max-width:100%}
.mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.mbody input,.mbody textarea{font-size:var(--t-s);padding:7px 9px}
.mtags{display:flex;flex-wrap:wrap;gap:5px}
.mtags .opt{padding:4px 8px;font-size:11.5px}

/* workspace */
.ws-head{padding-block:22px 0;display:flex;flex-direction:column;gap:14px}
.ws-title{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.flow-step{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--muted);line-height:1.25;padding-right:6px}
.flow-step i{height:3px;border-radius:2px;background:var(--sunk)}
.flow-step.done i{background:var(--accent-line)}
.flow-step.now i{background:var(--accent)}
.flow-step.now{color:var(--fg);font-weight:600}
.flow-step.alert i{background:var(--bad)}
.ov{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;padding-block:20px 60px}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:8px 18px;font-size:var(--t-s)}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;font-size:var(--t-s);padding:9px 11px;border-radius:var(--r-s);background:var(--sunk);align-items:flex-start}
.chk.warn{background:var(--warn-soft);color:var(--warn)}
.chk.info{background:var(--info-soft);color:var(--info)}
.chk.ok{background:var(--accent-soft);color:var(--accent)}
.chk svg{margin-top:2px}
.callout{padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--accent-line);background:var(--accent-soft);font-size:var(--t-s);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}

/* brief */
.brief-ed{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding-block:20px 60px}
.secnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.secrow{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;border-radius:var(--r-s);font-size:var(--t-s)}
.secrow[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.secrow button.nm{flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0;cursor:pointer;line-height:1.3}
.secrow.off button.nm{color:var(--muted);text-decoration:line-through}
.secrow .mini{width:24px;height:24px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.secrow .mini:hover{background:var(--sunk);color:var(--fg)}
.block{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.block.note{border-color:var(--accent-line);background:var(--accent-soft)}
.block.ai{border-color:transparent;background:var(--info-soft)}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* document view */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:860px;margin:0 auto;padding:clamp(22px,5vw,64px)}
.doc-cover{display:flex;flex-direction:column;gap:18px;padding-bottom:36px;border-bottom:1px solid var(--line);margin-bottom:32px}
.doc-cover h1{font-size:clamp(30px,5vw,46px);font-weight:500;letter-spacing:-.025em}
.doc-sec{display:flex;flex-direction:column;gap:12px;padding-block:22px;border-bottom:1px solid var(--line)}
.doc-sec:last-child{border-bottom:0}
.doc-sec h2{display:flex;gap:14px;align-items:baseline;font-size:21px}
.doc-sec h2 .mono{color:var(--accent);font-size:13px}
.doc-sec p,.doc-sec li{max-width:68ch;color:var(--fg-2)}
.doc-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc-sec h4{margin-top:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--t-s)}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.k{color:var(--muted);width:34%}
.dnote{border-left:3px solid var(--accent);padding:8px 14px;background:var(--accent-soft);border-radius:0 var(--r-s) var(--r-s) 0;font-size:var(--t-s)}
.dnote.ai{border-left-color:var(--info);background:var(--info-soft)}
.dimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dimgs figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dimgs .mimg{border-radius:4px;overflow:hidden}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
.sign div{border-top:1px solid var(--fg);padding-top:6px;font-size:var(--t-s);color:var(--muted);min-height:60px}
.missing{color:var(--warn);font-style:italic}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);width:min(680px,100%);margin-top:4vh;display:flex;flex-direction:column}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:22px;display:flex;flex-direction:column;gap:18px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.copybox{display:flex;gap:8px}
.copybox input{font-family:var(--font-m);font-size:12.5px}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);font-size:var(--t-s);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.bad{background:var(--bad);color:#fff}
.center-screen{min-height:70vh;display:grid;place-items:center;padding:24px}
.center-card{max-width:560px;width:100%;display:flex;flex-direction:column;gap:18px}
.consent{max-height:280px;overflow:auto;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);font-size:var(--t-s);color:var(--fg-2);display:flex;flex-direction:column;gap:10px}
.hero-client{padding-block:34px 8px;display:flex;flex-direction:column;gap:10px}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat:nth-child(4){border-right:0}
  .stat:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .ov{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .q,.brief-ed{grid-template-columns:minmax(0,1fr)}
  .flow-step{min-width:76px}
  .steps,.secnav{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
  .step{flex:none}
  .step .lbl{display:none}
  .step[aria-current="step"] .lbl{display:inline}
  .secnav{flex-direction:column;max-height:260px}
  .progress{display:none}
}
@media (max-width:600px){
  .fgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
  .stat:nth-child(2n){border-right:0!important}
  .nav button span{display:none}
  .brand-sub,.role{display:none}
  .sign{grid-template-columns:1fr}
  h1{font-size:26px}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
}

<script>
"use strict";
const {useState,useEffect,useMemo,useRef,useCallback,Fragment} = React;
const html = htm.bind(React.createElement);

/* ================= utilities ================= */
const now = () => Date.now();
const rid = (n=12) => { const a=new Uint8Array(n); crypto.getRandomValues(a); const c='abcdefghijkmnpqrstuvwxyz23456789'; return Array.from(a,x=>c[x%c.length]).join(''); };
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const fmtDate = ts => { if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return String(ts); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const fmtDT = ts => ts ? new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const fmtSize = b => b>1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1,Math.round(b/1e3))+' KB';
const lc = s => (s||'').toString().toLowerCase();
function isEmpty(v){
  if(v==null||v==='') return true;
  if(Array.isArray(v)) return v.length===0;
  if(typeof v==='object'){ if('v' in v) return isEmpty(v.v); return Object.values(v).every(isEmpty); }
  return false;
}
const joinList = arr => { arr=(arr||[]).filter(Boolean); if(arr.length<2) return arr.join(''); return arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1]; };
const CUR_SYM = {THB:'฿',MMK:'K',USD:'$',SGD:'S$',GBP:'£',EUR:'€'};
function money(n,cur){ if(n===''||n==null||isNaN(+n)) return ''; const v=(+n).toLocaleString('en-GB',{maximumFractionDigits:0}); return cur==='MMK' ? v+' MMK' : (cur? (CUR_SYM[cur]||cur+' ')+v : v); }
function measureText(m){ if(!m||isEmpty(m.v)) return ''; return `${m.v} ${m.unit||''}`.trim(); }

/* toast bus */
const toastSubs=new Set();
function toast(msg,bad){ toastSubs.forEach(f=>f({id:rid(6),msg,bad})); }
function errMsg(e){
  const c=e&&e.code, m=(e&&e.message)||'';
  if(/invalid api key|no api key|apikey/i.test(m)) return 'The connection key in config.js isn’t right. In Supabase → Project Settings → API Keys, open “Legacy API keys”, copy the “anon public” key (it starts with eyJ) and paste it into config.js. (Technical detail: '+m+')';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Could not reach the database. Check the Project URL in config.js is exactly right (it ends in .supabase.co), and that the Supabase project isn’t paused. (Technical detail: '+m+')';
  if(c==='invalid_argument'||/row-level security|permission denied/i.test(m)) return 'This change could not be saved because your account does not have permission.';
  if(/JWT|expired|refresh token/i.test(m)) return 'Your session has expired. Reload the page and sign in again.';
  if(/payload too large|413|too large/i.test(m)) return 'That is too large to save. Try a smaller file.';
  return m||'Something went wrong. Please try again.';
}
const ICONS={
  plus:'M12 5v14M5 12h14', search:'M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM21 21l-4.3-4.3', back:'M15 18l-6-6 6-6', next:'M9 18l6-6-6-6',
  up:'M18 15l-6-6-6 6', down:'M6 9l6 6 6-6', x:'M18 6L6 18M6 6l12 12', check:'M20 6L9 17l-5-5', copy:'M9 9h11v11H9zM5 15H4V4h11v1',
  file:'M14 3H6v18h12V7zM14 3v4h4', upload:'M12 16V4M7 9l5-5 5 5M4 20h16', download:'M12 4v12M7 11l5 5 5-5M4 20h16', trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
  alert:'M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', info:'M12 16v-4M12 8h.01M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z',
  link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1', grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
  doc:'M7 3h10l2 2v16H5V3zM9 9h6M9 13h6M9 17h4', spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z', send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',
  eye:'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', archive:'M3 4h18v5H3zM5 9v11h14V9M10 13h4', heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z',
  user:'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', edit:'M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z', clock:'M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM12 7v5l3 2'
};
const Icon = ({n,s}) => html`<svg className="i" viewBox="0 0 24 24" aria-hidden="true" style=${s?{width:s,height:s}:null}><path d=${ICONS[n]}/></svg>`;

/* ================= backend: Supabase when configured, this browser in demo mode ================= */
const CFG=window.BRIEF_CONFIG||{};
const BUCKET='brief-files';
const Auth={mode:'loading',sb:null,session:null,isAdmin:false,anon:false,email:'',error:''};
let DB=null;

function deepMerge(a,b){ const o={...(a||{})}; for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?deepMerge(o[k],v):v; } return o; }

/* demo mode: everything is kept in this browser */
function makeLocalDB(){
  const KEY='mn-brief-demo-v1'; let store={};
  try{ store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ store={}; }
  const subs=new Set(); let warned=false;
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){ if(!warned){warned=true; toast('This browser has no room to keep more data. Large files will not survive a reload.',true);} } };
  const emit=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=p=>({id:p.split('/').pop(),exists:p in store,data:()=>store[p],metadata:meta});
  const doc=p=>({id:p.split('/').pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=clone(d);persist();emit();},
    delete:async()=>{delete store[p];persist();emit();},
    onSnapshot:(next)=>{const f=()=>next(snap(p)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f);}});
  const col=p=>{ const depth=p.split('/').length+1;
    const list=()=>Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.split('/').length===depth).sort().map(snap);
    const qs=()=>{const docs=list(); return {docs,size:docs.length,empty:!docs.length,metadata:meta};};
    return {path:p,doc:id=>doc(p+'/'+(id||rid())),get:async()=>qs(),
      onSnapshot:(next)=>{const f=()=>next(qs()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f);}};
  };
  return {doc,collection:col,supa:null};
}

/* live mode: the same document interface, stored in Supabase tables */
function makeSupaDB(sb){
  function route(path){
    const s=path.split('/');
    if(s[0]==='studio'&&s.length===2) return {table:'settings',id:s[1]};
    if(s[0]==='projects'){
      if(s.length===1) return {table:'projects'};
      if(s.length===2) return {table:'projects',id:s[1]};
      if(s[2]==='versions'&&s.length===3) return {table:'versions',pid:s[1]};
      if(s[2]==='versions'&&s.length===4) return {table:'versions',id:s[1]+'__'+s[3],pid:s[1],short:s[3]};
    }
    if((s[0]==='briefs'||s[0]==='issued')&&s.length<=2) return s.length===1?{table:s[0]}:{table:s[0],id:s[1]};
    throw new Error('Unknown data path: '+path);
  }
  const meta={fromCache:false,hasPendingWrites:false};
  const wrap=e=>{ const m=(e&&e.message)||String(e||''); return {code:/row-level security|permission denied|violates/i.test(m)?'invalid_argument':(e&&e.code)||'error',message:m}; };
  const listeners=new Map(); let channel=null;
  function ensureChannel(){ if(channel) return; try{ channel=sb.channel('brief-db').on('postgres_changes',{event:'*',schema:'public'},p=>notify(p.table)).subscribe(); }catch(e){ console.warn('Live updates unavailable',e); } }
  function notify(table){ const set=listeners.get(table); if(set) set.forEach(f=>f()); }
  window.addEventListener('focus',()=>listeners.forEach(set=>set.forEach(f=>f())));
  function listen(table,fn){ ensureChannel(); if(!listeners.has(table)) listeners.set(table,new Set()); const set=listeners.get(table); let t=null; const deb=()=>{clearTimeout(t); t=setTimeout(fn,150);}; set.add(deb); return ()=>{ set.delete(deb); clearTimeout(t); }; }
  async function fetchOne(r){ const {data,error}=await sb.from(r.table).select('id,data').eq('id',r.id).maybeSingle(); if(error) throw wrap(error); return data; }
  const snap=(r,row)=>({id:r.short||r.id,exists:!!row,data:()=>row?row.data:undefined,metadata:meta});
  function doc(path){ const r=route(path); return {id:r.short||r.id,path,
    get:async()=>snap(r,await fetchOne(r)),
    set:async d=>{ const row={id:r.id,data:d,updated_at:new Date().toISOString()}; if(r.pid) row.project_id=r.pid; const {error}=await sb.from(r.table).upsert(row); if(error) throw wrap(error); notify(r.table); },
    delete:async()=>{ const {error}=await sb.from(r.table).delete().eq('id',r.id); if(error) throw wrap(error); notify(r.table); },
    onSnapshot:(next,err)=>{ let alive=true; const load=()=>fetchOne(r).then(row=>{ if(alive) next(snap(r,row)); },e=>{ if(alive&&err) err(e); }); load(); const un=listen(r.table,load); return ()=>{ alive=false; un(); }; }}; }
  function collection(path){ const r=route(path);
    const load=async()=>{ let q=sb.from(r.table).select('id,data'); if(r.pid) q=q.eq('project_id',r.pid); const {data,error}=await q; if(error) throw wrap(error);
      const docs=(data||[]).map(row=>({id:r.table==='versions'?String(row.id).split('__').pop():row.id,exists:true,data:()=>row.data,metadata:meta})); return {docs,size:docs.length,empty:!docs.length,metadata:meta}; };
    return {path,doc:id=>doc(path+'/'+id),get:load,
      onSnapshot:(next,err)=>{ let alive=true; const run=()=>load().then(s=>{ if(alive) next(s); },e=>{ if(alive&&err) err(e); }); run(); const un=listen(r.table,run); return ()=>{ alive=false; un(); }; }}; }
  return {doc,collection,supa:sb};
}

function isConfigured(){ const u=CFG.supabaseUrl||'', k=CFG.supabaseAnonKey||''; return /^https:\/\//.test(u)&&k.length>20&&!/YOUR-/.test(u+k); }
async function initBackend(){
  if(!isConfigured()){ Auth.mode='demo'; DB=makeLocalDB(); Auth.isAdmin=true; return; }
  if(!window.supabase||!window.supabase.createClient){ Auth.mode='error'; Auth.error='The database library could not load. Check your internet connection, then reload the page.'; return; }
  const sb=window.supabase.createClient(CFG.supabaseUrl.replace(/\/+$/,''),CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mn-brief-auth'}});
  Auth.sb=sb; Auth.mode='live'; DB=makeSupaDB(sb);
  await refreshAuth();
}
async function refreshAuth(){
  const {data}=await Auth.sb.auth.getSession(); const s=(data&&data.session)||null;
  Auth.session=s; Auth.anon=!!(s&&s.user&&s.user.is_anonymous); Auth.email=(s&&s.user&&s.user.email)||''; Auth.isAdmin=false;
  if(s&&!Auth.anon){ try{ const r=await Auth.sb.rpc('is_admin'); if(r.error) console.warn(r.error); Auth.isAdmin=r.data===true; }catch(e){ console.warn(e); } }
}
async function signOut(){ try{ await Auth.sb.auth.signOut(); }catch(e){} try{ history.replaceState(null,'',location.pathname); }catch(e){} location.reload(); }

/* live hooks */
function useCollection(path){
  const [st,setSt]=useState({docs:null,error:null,slow:false});
  useEffect(()=>{
    if(!path||!DB){ setSt({docs:[],error:null,slow:false}); return; }
    let settled=false; setSt({docs:null,error:null,slow:false});
    const t=setTimeout(()=>{ if(!settled) setSt(s=>({...s,slow:true})); },10000);
    let un=()=>{};
    try{ un=DB.collection(path).onSnapshot(s=>{ settled=true; clearTimeout(t); setSt({docs:s.docs.map(d=>({...d.data(),_id:d.id})),error:null,slow:false}); },
      e=>{ settled=true; clearTimeout(t); console.warn(e); setSt(s=>({...s,docs:s.docs||[],error:e})); }); }catch(e){ setSt({docs:[],error:e,slow:false}); }
    return ()=>{ clearTimeout(t); un(); };
  },[path]);
  return st;
}
function useDocValue(path){
  const [st,setSt]=useState({data:undefined,slow:false});
  useEffect(()=>{
    if(!path||!DB){ setSt({data:null}); return; }
    let settled=false; setSt({data:undefined,slow:false});
    const t=setTimeout(()=>{ if(!settled) setSt(s=>({...s,slow:true})); },10000);
    const un=DB.doc(path).onSnapshot(s=>{ settled=true; clearTimeout(t); setSt({data:s.exists?s.data():null,slow:false}); },
      ()=>{ settled=true; clearTimeout(t); setSt({data:null,slow:false}); });
    return ()=>{ clearTimeout(t); un(); };
  },[path]);
  return st;
}
/* editable document: local state wins while unsaved edits exist; debounced whole-document writes, one at a time */
function useLiveDoc(path,delay=800){
  const [data,setData]=useState(undefined);
  const [save,setSave]=useState('saved');
  const seq=useRef(0), saved=useRef(0), latest=useRef(undefined), timer=useRef(null), chain=useRef(Promise.resolve()), pathRef=useRef(path);
  const flush=useCallback(()=>{
    clearTimeout(timer.current);
    if(seq.current<=saved.current) return chain.current;
    const s=seq.current, body=clone(latest.current), p=pathRef.current;
    if(!p||!body) return chain.current;
    chain.current=chain.current.then(()=>DB.doc(p).set(body)).then(()=>{ saved.current=Math.max(saved.current,s); if(saved.current>=seq.current) setSave('saved'); })
      .catch(e=>{ setSave('error'); toast(errMsg(e),true); saved.current=s; });
    return chain.current;
  },[]);
  useEffect(()=>{
    pathRef.current=path; seq.current=0; saved.current=0; setData(undefined);
    if(!path||!DB){ setData(null); return; }
    const un=DB.doc(path).onSnapshot(s=>{ if(seq.current>saved.current) return; const d=s.exists?s.data():null; latest.current=d; setData(d); },()=>{ if(latest.current===undefined) setData(null); });
    return ()=>{ un(); flush(); };
  },[path]);
  const update=useCallback(fn=>{
    const next=typeof fn==='function'?fn(clone(latest.current)):fn;
    latest.current=next; seq.current++; setData(next); setSave('saving');
    clearTimeout(timer.current); timer.current=setTimeout(flush,delay);
  },[delay]);
  const saveNow=useCallback(()=>flush(),[]);
  useEffect(()=>{ const f=()=>flush(); window.addEventListener('pagehide',f); const v=()=>{ if(document.visibilityState==='hidden') flush(); }; document.addEventListener('visibilitychange',v); return ()=>{ window.removeEventListener('pagehide',f); document.removeEventListener('visibilitychange',v); }; },[]);
  return [data,update,save,saveNow];
}

/* ================= files: Supabase Storage (live) or chunks in this browser (demo) ================= */
const CHUNK=180000, MAX_FILE=50e6;
const blobCache=new Map(), metaCache=new Map(), urlCache=new Map();
function readAsDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
async function imageTo(blob,max,q){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',q));
  } finally{ URL.revokeObjectURL(url); }
}
const isImg=t=>/^image\/(png|jpe?g|webp|heic|heif|bmp)/i.test(t||'');
function fileKind(name,type){
  const n=lc(name);
  if(isImg(type)||/\.(png|jpe?g|webp|gif)$/.test(n)) return 'image';
  if(/\.pdf$/.test(n)) return 'pdf'; if(/\.dwg$|\.dxf$/.test(n)) return 'dwg';
  if((type||'').startsWith('video/')) return 'video';
  if(/\.(skp|3dm|obj|fbx|rvt|max|blend|glb|gltf|3ds)$/.test(n)) return '3d';
  return 'doc';
}
async function saveFile(pid,file,extra={}){
  let blob=file, type=file.type||'application/octet-stream', thumb=null; const name=file.name||'file';
  const kind=fileKind(name,type);
  if(kind==='image'&&isImg(type)){
    try{ blob=await imageTo(file,1800,.84); type='image/jpeg'; if(!DB.supa){ const t=await imageTo(file,320,.7); thumb=await readAsDataURL(t); } }catch(e){ blob=file; }
  }
  if(blob.size>MAX_FILE) throw new Error(`${name} is ${fmtSize(blob.size)}. The limit is 50 MB per file — share larger files, such as long videos, as a link in the notes.`);
  if(DB.supa){
    const safe=name.replace(/[^\w.\-]+/g,'_').slice(-80)||'file';
    const ref=`${pid}/${rid(10)}-${safe}`;
    const {error}=await DB.supa.storage.from(BUCKET).upload(ref,blob,{contentType:type,upsert:false});
    if(error) throw new Error(/row-level|policy|unauthori/i.test(error.message||'')?'You do not have permission to upload files to this project.':`${name} could not be uploaded: ${error.message}`);
    blobCache.set(ref,blob);
    return {ref,name,type,size:blob.size,kind};
  }
  const b64=(await readAsDataURL(blob)).split(',')[1]||''; const n=Math.max(1,Math.ceil(b64.length/CHUNK));
  const ref=`files/${pid}/items/${rid(14)}`;
  for(let i=0;i<n;i++) await DB.doc(`${ref}/chunks/${i}`).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)});
  const meta={name,type,size:blob.size,chunks:n,kind,thumb,createdAt:now(),...extra};
  await DB.doc(ref).set(meta); metaCache.set(ref,meta);
  return {ref,name,type,size:blob.size,kind};
}
async function getMeta(ref){ if(metaCache.has(ref)) return metaCache.get(ref); const s=await DB.doc(ref).get(); const m=s.exists?s.data():null; if(m) metaCache.set(ref,m); return m; }
async function loadBlob(ref){
  if(blobCache.has(ref)) return blobCache.get(ref);
  if(DB.supa){ const {data,error}=await DB.supa.storage.from(BUCKET).download(ref); if(error) throw error; blobCache.set(ref,data); return data; }
  const m=await getMeta(ref); if(!m) throw new Error('File not found');
  const parts=[]; for(let i=0;i<m.chunks;i++){ const s=await DB.doc(`${ref}/chunks/${i}`).get(); parts.push(s.exists?s.data().d:''); }
  const bin=atob(parts.join('')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const b=new Blob([u],{type:m.type}); blobCache.set(ref,b); return b;
}
async function deleteFile(ref){
  try{
    if(DB.supa){ await DB.supa.storage.from(BUCKET).remove([ref]); }
    else { const m=await getMeta(ref); if(m) for(let i=0;i<m.chunks;i++) await DB.doc(`${ref}/chunks/${i}`).delete(); await DB.doc(ref).delete(); }
  }catch(e){}
  metaCache.delete(ref); blobCache.delete(ref); urlCache.delete(ref);
}
async function fileUrl(ref){
  if(urlCache.has(ref)) return urlCache.get(ref);
  let u;
  if(DB.supa){ const {data,error}=await DB.supa.storage.from(BUCKET).createSignedUrl(ref,6*3600); if(error) throw error; u=data.signedUrl; }
  else { const m=await getMeta(ref); u=m&&m.thumb?m.thumb:URL.createObjectURL(await loadBlob(ref)); }
  urlCache.set(ref,u); return u;
}
async function downloadBlob(filename,blob){
  try{ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),8000); return true; }
  catch(e){ toast('The download could not start in this browser.',true); return false; }
}
function useThumb(ref){
  const [src,setSrc]=useState(null);
  useEffect(()=>{ let on=true; if(!ref) return; fileUrl(ref).then(u=>{ if(on) setSrc(u); }).catch(()=>{}); return ()=>{on=false;}; },[ref]);
  return src;
}

  {k:'save',label:'Where would you prefer to save money?',type:'textarea',rows:2},
 ]},
 {id:'site',title:'Site and existing conditions',short:'Site',intro:'What is there today. Estimates are fine — every estimated measurement is marked as an estimate and checked on site before design starts.',fields:[
  {k:'floorArea',label:'Total floor area',type:'measure',units:['m²','sq ft'],req:1,half:1},
  {k:'ceiling',label:'Ceiling height',type:'measure',units:['m','mm','ft'],half:1},
  {k:'floors',label:'Number of floors',type:'number',half:1},

  {k:'existing',label:'Existing furniture and fixtures',type:'textarea',rows:2},

 ]},
 {id:'sustain',title:'Sustainability, comfort and accessibility',short:'Comfort',intro:'For each item, tell us whether it is essential, nice to have, or not relevant to you right now.',fields:[
  {k:'items',type:'tri',items:SUSTAIN,label:'Considerations'},

 ]},
 {id:'scope',title:'Services and deliverables',short:'Services',intro:'The design services for this project. Your designer confirms the final scope — mark anything you are unsure about as “Not sure”.',fields:[
  {k:'items',type:'services',items:SERVICES,label:'Services'},
  {k:'notes',label:'Notes on scope',type:'textarea',rows:3},
 ]},
 {id:'priorities',title:'Priorities and expectations',short:'Priorities',intro:'Put what matters most at the top. This helps when choices have to be made between cost, looks and practicality.',fields:[
  {k:'rank',type:'rank',label:'Rank your priorities',req:1,items:A=>PRIORITY_ITEMS.filter(x=>isCom(A)||(x!=='Brand identity'&&x!=='Customer experience')),help:'Use the arrows to move items. The top three carry the most weight.'},
  {k:'essential',label:'Essential requirements',type:'textarea',rows:2},
  {k:'preferred',label:'Nice-to-have features',type:'textarea',rows:2},
  {k:'nonneg',label:'Non-negotiables',type:'textarea',rows:2,help:'Things that must happen, whatever else changes.'},
  {k:'avoid',label:'Design elements to avoid',type:'textarea',rows:2},
  {k:'challenges',label:'Known challenges or restrictions',type:'textarea',rows:2},
  {k:'decision',label:'Who makes the final decisions?',type:'textarea',rows:2,help:'Names and roles, and how approvals work — for example both partners, or the owner and the operations manager.'},
  {k:'comms',label:'Preferred ways to communicate',type:'chips',opts:COMMS},
  {k:'updates',label:'How often would you like updates?',type:'radio',opts:['Weekly','Every two weeks','At each milestone','Only when something is needed']},
  {k:'notes',label:'Additional notes and special instructions',type:'textarea',rows:3},
 ]},
];
const SEC=Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const labelOf=(f,A)=>typeof f.label==='function'?f.label(A):f.label;
const visibleFields=(sec,A,designer)=>sec.fields.filter(f=>(designer||!f.designerOnly)&&(!f.when||f.when(A))&&f.type!=='info');
const ansOf=(A,s,k)=>A&&A[s]?A[s][k]:undefined;

function fieldAnswered(f,v,A){
  if(f.type==='spaces') return Array.isArray(v)&&v.length>0;
  if(f.type==='styles') return v&&Array.isArray(v.like)&&v.like.length>0;
  if(f.type==='rank') return Array.isArray(v)&&v.length>0;
  if(f.type==='tri'||f.type==='services') return v&&Object.values(v).some(Boolean);
  if(f.type==='chips') return v&&((v.sel&&v.sel.length)||v.other);
  return !isEmpty(v);
}
function sectionStats(sec,A,designer){
  const fs=visibleFields(sec,A,designer).filter(f=>f.type!=='files'&&f.type!=='moodboard');
  let done=0, missingReq=[];
  fs.forEach(f=>{ const ok=fieldAnswered(f,ansOf(A,sec.id,f.k),A); if(ok) done++; else if(f.req) missingReq.push(labelOf(f,A)); });
  return {total:fs.length,done,missingReq};
}
function completion(A,designer){ let t=0,d=0; SECTIONS.forEach(s=>{const st=sectionStats(s,A,designer); t+=st.total; d+=st.done;}); return t?Math.round(d/t*100):0; }
function chipsVal(v){ return v?[...(v.sel||[]),...(v.other?[v.other]:[])]:[]; }

/* ================= status workflow ================= */
const FLOW=['Enquiry','Project Created','Brief Sent','Client Completing Brief','Submitted','Designer Review','Revision Requested','Client Approval','Approved'];
const STATUS_CLASS={'Enquiry':'s-new','Project Created':'s-work','Brief Sent':'s-wait','Client Completing Brief':'s-wait','Submitted':'s-sub','Designer Review':'s-work','Revision Requested':'s-rev','Client Approval':'s-wait','Approved':'s-ok','Archived':'s-arch'};
function clientLink(p,claims){
  if(!p) return null;
  return (claims||[]).find(c=>c._id===p.id)||null;
}
function events(p,c){
  const src=c||p.local||{};
  return {startedAt:src.startedAt||null,submittedAt:src.submittedAt||null,approval:src.approval||null};
}
function deriveStatus(p,c){
  if(!p) return '';
  if(p.archived) return 'Archived';
  const ev=events(p,c); let s=p.stage==='enquiry'?'Enquiry':'Project Created'; let t=p.createdAt||0;
  if(p.invite&&p.invite.sentAt){s='Brief Sent';t=p.invite.sentAt;}
  if(ev.startedAt){s='Client Completing Brief';t=ev.startedAt;}
  if(ev.submittedAt){ s=(p.reviewedAt&&p.reviewedAt>=ev.submittedAt)?'Designer Review':'Submitted'; t=Math.max(ev.submittedAt,p.reviewedAt||0); }
  if(p.issued){ s='Client Approval'; t=Math.max(t,p.issued.at||0); }
  if(ev.approval&&p.issued&&ev.approval.version===p.issued.version){ s=ev.approval.status==='approved'?'Approved':'Revision Requested'; t=Math.max(t,ev.approval.at||0); }
  if(p.statusOverride&&p.statusOverride.at>=t) s=p.statusOverride.status;
  return s;
}
const BUCKETS=[
  {id:'all',label:'Total projects',test:s=>s!=='Archived'},
  {id:'enq',label:'New enquiries',test:s=>s==='Enquiry'},
  {id:'prog',label:'Briefs in progress',test:s=>['Project Created','Designer Review','Revision Requested'].includes(s)},
  {id:'wait',label:'Awaiting client completion',test:s=>['Brief Sent','Client Completing Brief'].includes(s)},
  {id:'sub',label:'Submitted briefs',test:s=>s==='Submitted'},
  {id:'appr',label:'Awaiting approval',test:s=>s==='Client Approval'},
  {id:'ok',label:'Approved briefs',test:s=>s==='Approved'},
  {id:'arch',label:'Archived',test:s=>s==='Archived'},
];

/* ================= checks: conflicts, budget completeness, missing info ================= */
function budgetNums(b){ const keys=['designFee','construction','furniture','lighting','decoration','customFurniture','contingency']; let sum=0,count=0; keys.forEach(k=>{ const v=+((b||{})[k]); if(b&&b[k]!==''&&b[k]!=null&&!isNaN(v)){sum+=v;count++;} }); return {sum,count,keys}; }
function runChecks(A){
  A=A||{}; const out=[]; const b=A.budget||{}, st=A.style||{}, pr=A.priorities||{}, pf=A.profile||{}, sp=(A.spaces&&A.spaces.list)||[], site=A.site||{}, info=A.info||{};
  const inc=chipsVal(b.includes); const {sum,count}=budgetNums(b); const total=+b.total;
  if(!b.total) out.push({lv:'warn',cat:'Budget',t:'No total budget has been given yet.'});
  if(b.total&&count&&sum>total) out.push({lv:'warn',cat:'Budget',t:`The budget breakdown adds up to ${money(sum,b.currency)}, which is more than the total of ${money(total,b.currency)}.`});
  if(b.total&&count&&sum<total*0.6&&count>=4) out.push({lv:'info',cat:'Budget',t:`The breakdown accounts for ${Math.round(sum/total*100)}% of the total. Confirm what the remainder is for.`});
  if(inc.includes('Design fees')&&!b.designFee&&b.total) out.push({lv:'info',cat:'Budget',t:'The total is said to include design fees, but no amount has been set aside for them.'});
  if(b.total&&!b.contingency) out.push({lv:'info',cat:'Budget',t:'No contingency allowance is recorded. Discuss with the client how unexpected costs will be covered.'});
  if(b.total&&!inc.includes('Taxes (VAT)')&&inc.length) out.push({lv:'info',cat:'Budget',t:'Taxes are not included in the stated budget, so it is treated as a pre-tax figure.'});
  if(b.flexibility==='Fixed — cannot go over'&&!b.contingency&&b.total) out.push({lv:'warn',cat:'Budget',t:'The budget is fixed and has no contingency. Any unforeseen site work would need to come out of the design budget.'});
  const top3=(pr.rank||[]).slice(0,3);
  if(top3[0]==='Budget'&&b.flexibility==='Flexible for the right result') out.push({lv:'info',cat:'Priorities',t:'Budget is ranked first, yet the budget is described as flexible. Confirm which takes precedence.'});
  const likes=(st.styles&&st.styles.like)||[];
  if(likes.includes('minimal')&&(+st.decoration>=4)) out.push({lv:'warn',cat:'Style',t:'Modern Minimalism is liked, but a highly decorated, layered look is also requested.'});
  if(likes.includes('luxury')&&top3.includes('Budget')&&b.flexibility==='Fixed — cannot go over') out.push({lv:'info',cat:'Style',t:'A Modern Luxury direction is liked alongside a fixed budget ranked as a top priority. Material choices may need careful value engineering.'});
  const mats=chipsVal(st.materials);
  if(pf.pets&&pf.pets!=='None'&&mats.some(m=>['Velvet','Bouclé','Linen'].includes(m))) out.push({lv:'info',cat:'Materials',t:`Pets are in the home and ${joinList(mats.filter(m=>['Velvet','Bouclé','Linen'].includes(m)).map(lc))} is preferred. Check fabric durability with the client.`});
  if(top3.includes('Maintenance')&&mats.some(m=>['Marble','Velvet','Travertine','Brushed brass'].includes(m))) out.push({lv:'info',cat:'Materials',t:'Low maintenance is a top priority, but some preferred materials usually need regular care.'});
  if(pf.wfh&&['A few days a week','Full-time'].includes(pf.wfh)&&!sp.some(s=>/office|study|work/i.test(s.name||''))) out.push({lv:'warn',cat:'Spaces',t:'The client works from home regularly, but no home office or work space has been listed.'});
  const avoid=chipsVal(st.avoidColours).map(lc); const pal=(st.palettes||[]).map(id=>PALETTES.find(p=>p.id===id)).filter(Boolean);
  if(avoid.includes('black')&&pal.some(p=>p.id==='monochrome')) out.push({lv:'warn',cat:'Colour',t:'Black is listed as a colour to avoid, but the black-and-white palette is also selected.'});
  if(info.startDate&&info.endDate&&new Date(info.endDate)<new Date(info.startDate)) out.push({lv:'warn',cat:'Timeline',t:'The expected completion date is earlier than the start date.'});
  const sus=(A.sustain&&A.sustain.items)||{};
  if((sus['Accessibility and inclusive design']==='essential'||sus['Age-friendly design']==='essential')&&!sp.some(s=>s.access)) out.push({lv:'info',cat:'Accessibility',t:'Accessibility is marked essential, but no room-level accessibility needs have been described.'});
  const est=[]; if(site.floorArea&&site.floorArea.v&&site.floorArea.status!=='verified') est.push('floor area'); if(site.ceiling&&site.ceiling.v&&site.ceiling.status!=='verified') est.push('ceiling height');
  const estRooms=sp.filter(s=>s.dims&&(s.dims.l||s.dims.w)&&s.dims.status!=='verified').length;
  if(est.length||estRooms) out.push({lv:'info',cat:'Site',t:`Estimated measurements to verify on site: ${joinList([...est, estRooms?`${estRooms} room size${estRooms>1?'s':''}`:''].filter(Boolean))}.`});
  return out;
}
function outstanding(A,designer){
  A=A||{}; const items=[];
  SECTIONS.forEach(s=>{ visibleFields(s,A,false).forEach(f=>{ if(f.req&&!fieldAnswered(f,ansOf(A,s.id,f.k),A)) items.push({sec:s.title,t:labelOf(f,A),kind:'Required'}); }); });
  const imp=[['info','startDate'],['info','endDate'],['info','address'],['info','workType'],['site','ceiling'],['site','condition'],['site','structure'],['site','access'],['site','regulations'],['budget','flexibility'],['priorities','decision']];
  imp.forEach(([s,k])=>{ const f=SEC[s].fields.find(x=>x.k===k); if(f&&(!f.when||f.when(A))&&!fieldAnswered(f,ansOf(A,s,k),A)) items.push({sec:SEC[s].title,t:labelOf(f,A),kind:'Not yet provided'}); });
  const site=A.site||{};
  if(site.floorArea&&site.floorArea.v&&site.floorArea.status!=='verified') items.push({sec:'Site',t:`Floor area (${measureText(site.floorArea)}) is an estimate`,kind:'Verify on site'});
  if(site.ceiling&&site.ceiling.v&&site.ceiling.status!=='verified') items.push({sec:'Site',t:`Ceiling height (${measureText(site.ceiling)}) is an estimate`,kind:'Verify on site'});
  ((A.spaces&&A.spaces.list)||[]).forEach(sp=>{ const d=sp.dims||{}; if(!d.l&&!d.w) items.push({sec:'Spaces',t:`${sp.name||'Unnamed space'}: no dimensions`,kind:'Not yet provided'}); else if(d.status!=='verified') items.push({sec:'Spaces',t:`${sp.name}: ${d.l||'?'} × ${d.w||'?'} m is an estimate`,kind:'Verify on site'}); });
  const sv=(A.scope&&A.scope.items)||{}; const tbc=SERVICES.filter(x=>sv[x]==='tbc');
  if(tbc.length) items.push({sec:'Services',t:`Scope to confirm: ${joinList(tbc.map(lc))}`,kind:'To be confirmed'});
  if(site.verify) site.verify.split(/\n+/).filter(Boolean).forEach(l=>items.push({sec:'Site',t:l.replace(/^[-•]\s*/,''),kind:'Verify on site'}));
  if(!((site.files)||[]).some(f=>f.kind==='pdf'||f.kind==='dwg'||/plan/i.test(f.name||''))) items.push({sec:'Site',t:'Existing floor plan',kind:'Not yet provided'});
  return items;
}
</script>
<script>
/* ================= shared UI ================= */
function Toasts(){
  const [list,setList]=useState([]);
  useEffect(()=>{ const f=t=>{ setList(l=>[...l,t]); setTimeout(()=>setList(l=>l.filter(x=>x.id!==t.id)),4200); }; toastSubs.add(f); return ()=>toastSubs.delete(f); },[]);
  return html`<div className="toasts" role="status" aria-live="polite">${list.map(t=>html`<div key=${t.id} className=${'toast'+(t.bad?' bad':'')}>${t.msg}</div>`)}</div>`;
}
function Modal({title,onClose,children,footer,wide}){
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') onClose(); }; window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[]);
  return html`<div className="scrim" onMouseDown=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <div className="modal" role="dialog" aria-modal="true" aria-label=${title} style=${wide?{width:'min(860px,100%)'}:null}>
      <div className="modal-h"><h3>${title}</h3><button className="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} n="x"/></button></div>
      <div className="modal-b">${children}</div>
      ${footer&&html`<div className="modal-f">${footer}</div>`}
    </div></div>`;
}
const StatusPill=({s})=>html`<span className=${'pill '+(STATUS_CLASS[s]||'')}>${s}</span>`;
const SaveState=({s})=>html`<span className=${'savestate '+s}>${s==='saving'?'Saving…':s==='error'?'Not saved — check your connection':'All changes saved'}</span>`;
function copyText(text){
  const ok=()=>toast('Copied');
  try{ navigator.clipboard.writeText(text).then(ok,()=>fallbackCopy(text)); }catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Select the text and copy it manually.'); } t.remove(); }
function CopyBox({value,label}){
  const ref=useRef();
  return html`<div className="copybox"><input ref=${ref} readOnly value=${value} aria-label=${label||'Link'} onFocus=${e=>e.target.select()}/><button className="btn" onClick=${()=>{ copyText(value); ref.current&&ref.current.select(); }}><${Icon} n="copy"/>Copy</button></div>`;
}

/* ================= inputs ================= */
function Chips({opts,value,onChange,other,disabled}){
  const v=value||{sel:[],other:''}; const sel=v.sel||[];
  const tog=o=>onChange({...v,sel:sel.includes(o)?sel.filter(x=>x!==o):[...sel,o]});
  return html`<div className="stack" style=${{'--g':'8px'}}><div className="opts">${opts.map(o=>html`<button type="button" key=${o} className="opt" aria-pressed=${sel.includes(o)} disabled=${disabled} onClick=${()=>tog(o)}>${o}</button>`)}</div>
    ${other&&html`<input type="text" placeholder="Other (type your own)" value=${v.other||''} disabled=${disabled} onChange=${e=>onChange({...v,other:e.target.value})}/>`}</div>`;
}
function Radio({opts,value,onChange,disabled,name}){
  return html`<div className="opts" role="radiogroup" aria-label=${name}>${opts.map(o=>html`<button type="button" role="radio" key=${o} className="opt" aria-checked=${value===o} disabled=${disabled} onClick=${()=>onChange(value===o?'':o)}>${o}</button>`)}</div>`;
}
function Measure({units,value,onChange,disabled,designer}){
  const v=value||{v:'',unit:units[0],status:'estimate'};
  return html`<div className="measure">
    <input type="number" min="0" step="any" inputMode="decimal" value=${v.v} disabled=${disabled} aria-label="Value" onChange=${e=>onChange({...v,v:e.target.value})}/>
    <select value=${v.unit||units[0]} disabled=${disabled} aria-label="Unit" onChange=${e=>onChange({...v,unit:e.target.value})}>${units.map(u=>html`<option key=${u}>${u}</option>`)}</select>
    <div className="seg" role="group" aria-label="Measurement status">
      <button type="button" aria-pressed=${v.status!=='verified'} data-v="tbc" disabled=${disabled} onClick=${()=>onChange({...v,status:'estimate'})}>Estimate</button>
      <button type="button" aria-pressed=${v.status==='verified'} disabled=${disabled||!designer} title=${designer?'':'Only your designer can mark a measurement as verified on site'} onClick=${()=>onChange({...v,status:'verified'})}>Verified on site</button>
    </div></div>`;
}
function Scale({value,onChange,min,max,disabled}){
  return html`<div className="stack" style=${{'--g':'6px'}}><div className="scale" role="radiogroup">${[1,2,3,4,5].map(n=>html`<button type="button" key=${n} role="radio" aria-checked=${+value===n} aria-pressed=${+value===n} disabled=${disabled} onClick=${()=>onChange(+value===n?'':n)}>${n}</button>`)}</div>
    <div className="spread small muted" style=${{maxWidth:'226px'}}><span>${min}</span><span>${max}</span></div></div>`;
}
function TriList({items,value,onChange,disabled}){
  const v=value||{};
  const opts=[['essential','Essential'],['preferred','Nice to have'],['na','Not relevant']];
  return html`<div className="trilist">${items.map(it=>html`<div className="trirow" key=${it}><span className="grow">${it}</span>
    <div className="seg ess" role="group" aria-label=${it}>${opts.map(([k,l])=>html`<button type="button" key=${k} data-v=${k} aria-pressed=${v[it]===k} disabled=${disabled} onClick=${()=>onChange({...v,[it]:v[it]===k?'':k})}>${l}</button>`)}</div></div>`)}</div>`;
}
function ServicesList({items,value,onChange,disabled,designer}){
  const v=value||{};
  const opts=designer?[['included','Included'],['excluded','Excluded'],['tbc','To confirm']]:[['included','Interested'],['excluded','Not needed'],['tbc','Not sure']];
  return html`<div className="trilist">${items.map(it=>html`<div className="trirow" key=${it}><span className="grow">${it}</span>
    <div className="seg" role="group" aria-label=${it}>${opts.map(([k,l])=>html`<button type="button" key=${k} data-v=${k} aria-pressed=${v[it]===k} disabled=${disabled} onClick=${()=>onChange({...v,[it]:v[it]===k?'':k})}>${l}</button>`)}</div></div>`)}</div>`;
}
function RankList({items,value,onChange,disabled}){
  const order=useMemo(()=>{ const v=(value||[]).filter(x=>items.includes(x)); return [...v,...items.filter(x=>!v.includes(x))]; },[value,items]);
  const touched=Array.isArray(value)&&value.length>0;
  const mv=(i,d)=>{ const o=[...order]; const j=i+d; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; onChange(o); };
  return html`<div className="stack" style=${{'--g':'8px'}}>
    ${!touched&&html`<div className="row"><span className="help">This is the default order.</span><button type="button" className="btn sm" disabled=${disabled} onClick=${()=>onChange(order)}>Keep this order</button></div>`}
    <ol className="ranklist" style=${{margin:0,padding:0,listStyle:'none'}}>${order.map((it,i)=>html`<li className="rankrow" key=${it}><span className="n num">${String(i+1).padStart(2,'0')}</span><span className="grow">${it}</span>
      <button type="button" className="icon-btn" aria-label=${'Move '+it+' up'} disabled=${disabled||i===0} onClick=${()=>mv(i,-1)}><${Icon} n="up"/></button>
      <button type="button" className="icon-btn" aria-label=${'Move '+it+' down'} disabled=${disabled||i===order.length-1} onClick=${()=>mv(i,1)}><${Icon} n="down"/></button></li>`)}</ol></div>`;
}

/* style vignette: a small parametric room drawn from each style's palette */
function Vignette({s}){
  const [wall,floor,furn,acc]=s.pal;
  const win=s.win==='arch'?html`<path d="M100 60V28a14 14 0 0 1 28 0v32z" fill="#fff" opacity=".55"/>`
    :s.win==='grid'?html`<g><rect x="98" y="16" width="34" height="44" fill="#fff" opacity=".55"/><path d="M115 16v44M98 38h34" stroke=${wall} stroke-width="2"/></g>`
    :html`<rect x="102" y="12" width="22" height="48" fill="#fff" opacity=".55"/>`;
  const sofa=s.sofa==='curved'?html`<path d="M22 72q0-12 14-12h40q14 0 14 12v8H22z" fill=${furn}/>`
    :s.sofa==='tufted'?html`<g><rect x="22" y="58" width="68" height="22" rx="3" fill=${furn}/><rect x="18" y="64" width="8" height="16" rx="2" fill=${furn}/><rect x="86" y="64" width="8" height="16" rx="2" fill=${furn}/><circle cx="40" cy="65" r="1.3" fill=${wall} opacity=".6"/><circle cx="56" cy="65" r="1.3" fill=${wall} opacity=".6"/><circle cx="72" cy="65" r="1.3" fill=${wall} opacity=".6"/></g>`

function StyleCards({value,onChange,disabled}){

/* files */
function Thumb({f}){ const src=useThumb(f.kind==='image'?f.ref:null); return html`<div className="ficon">${src?html`<img src=${src} alt=""/>`:(f.kind||'file').toUpperCase().slice(0,4)}</div>`; }
function DropZone({onFiles,accept,label,disabled,busy}){
  const [over,setOver]=useState(false); const inp=useRef();
  return html`<div className=${'drop'+(over?' over':'')} onDragOver=${e=>{e.preventDefault();setOver(true);}} onDragLeave=${()=>setOver(false)}
    onDrop=${e=>{e.preventDefault();setOver(false); if(!disabled) onFiles([...e.dataTransfer.files]);}}>
    ${busy?html`<div className="row"><div className="spinner"></div><span>${busy}</span></div>`:html`<span>Drag files here, or</span><button type="button" className="btn sm" disabled=${disabled} onClick=${()=>inp.current.click()}><${Icon} n="upload"/>${label||'Choose files'}</button>`}
    <input ref=${inp} type="file" multiple accept=${accept} hidden onChange=${e=>{ onFiles([...e.target.files]); e.target.value=''; }}/></div>`;
}
function useUploader(base,onAdded){
  const [busy,setBusy]=useState('');
  const run=async(files,extra)=>{
    if(!base){ toast('Uploads are not available until the project is saved.',true); return; }
    const added=[];
    for(let i=0;i<files.length;i++){ const f=files[i]; setBusy(`Uploading ${f.name} (${i+1} of ${files.length})…`);
      try{ added.push(await saveFile(base,f,extra)); }catch(e){ toast(e.message||errMsg(e),true); } }
    setBusy(''); if(added.length){ onAdded(added); toast(added.length===1?'File uploaded':`${added.length} files uploaded`); }
  };
  return [busy,run];
}
function FileField({value,onChange,base,disabled}){
  const list=value||[];
  const [busy,run]=useUploader(base,added=>onChange([...(list),...added.map(a=>({...a,note:''}))]));
  const remove=async f=>{ onChange(list.filter(x=>x.ref!==f.ref)); deleteFile(f.ref); };
  const dl=async f=>{ try{ toast('Preparing download…'); const b=await loadBlob(f.ref); await downloadBlob(f.name,b); }catch(e){ toast('That file could not be opened.',true); } };
  return html`<div className="stack" style=${{'--g':'10px'}}>
    ${!disabled&&html`<${DropZone} onFiles=${fs=>run(fs)} busy=${busy} accept="image/*,video/*,.pdf,.dwg,.dxf,.skp,.3dm,.obj,.fbx,.rvt,.glb,.gltf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"/>`}
    ${list.length>0&&html`<div className="filelist">${list.map(f=>html`<div className="filerow" key=${f.ref}><${Thumb} f=${f}/>
      <div className="grow"><div style=${{fontWeight:500,overflowWrap:'anywhere'}}>${f.name}</div><div className="muted small"><span className="mono">${(f.kind||'').toUpperCase()}</span> · ${fmtSize(f.size||0)}</div>
      <input type="text" placeholder="Add a note (optional)" value=${f.note||''} disabled=${disabled} style=${{marginTop:'6px',fontSize:'13px',padding:'6px 8px'}} onChange=${e=>onChange(list.map(x=>x.ref===f.ref?{...x,note:e.target.value}:x))}/></div>
      <button type="button" className="icon-btn" aria-label=${'Download '+f.name} onClick=${()=>dl(f)}><${Icon} n="download"/></button>
      ${!disabled&&html`<button type="button" className="icon-btn" aria-label=${'Remove '+f.name} onClick=${()=>remove(f)}><${Icon} n="trash"/></button>`}</div>`)}</div>`}
  </div>`;
}
function MoodImg({f}){ const src=useThumb(f.ref); return html`<div className="mimg">${src?html`<img src=${src} alt=${f.caption||f.name}/>`:'Loading image…'}</div>`; }
function Moodboard({value,onChange,base,disabled}){
  const list=value||[];
  const [busy,run]=useUploader(base,added=>onChange([...list,...added.filter(a=>a.kind==='image').map(a=>({...a,caption:'',tags:[],comment:''}))]));

    ${list.length>0&&html`<div className="mood">${list.map(f=>html`<div className="mitem" key=${f.ref}><${MoodImg} f=${f}/>
      <div className="mbody"><input type="text" placeholder="Caption" value=${f.caption||''} disabled=${disabled} onChange=${e=>upd(f.ref,{caption:e.target.value})} aria-label="Caption"/>
      <div className="mtags">${MOOD_TAGS.map(t=>html`<button type="button" key=${t} className="opt" disabled=${disabled} aria-pressed=${(f.tags||[]).includes(t)} onClick=${()=>upd(f.ref,{tags:(f.tags||[]).includes(t)?f.tags.filter(x=>x!==t):[...(f.tags||[]),t]})}>${t}</button>`)}</div>
      <textarea rows="2" placeholder="Comment" value=${f.comment||''} disabled=${disabled} onChange=${e=>upd(f.ref,{comment:e.target.value})} aria-label="Comment"></textarea>
      ${!disabled&&html`<button type="button" className="btn ghost sm danger" onClick=${()=>{ onChange(list.filter(x=>x.ref!==f.ref)); deleteFile(f.ref); }}><${Icon} n="trash"/>Remove</button>`}</div></div>`)}</div>`}
  </div>`;

/* spaces */
function SpacesEditor({value,onChange,A,disabled,designer}){

  const pt=ptype(A); const presets=[...(isRes(A)?RES_SPACES:COM_SPACES),...(EXTRA_SPACES[pt]||[])];
  const add=name=>{ const id=rid(8); onChange([...list,{id,name,dims:{l:'',w:'',status:'estimate'}}]); setOpen(id); };
  const upd=(id,patch)=>onChange(list.map(s=>s.id===id?{...s,...patch}:s));
  const mv=(i,d)=>{ const o=[...list]; const j=i+d; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; onChange(o); };
  return html`<div className="stack" style=${{'--g':'12px'}}>
    ${!disabled&&html`<div className="stack" style=${{'--g':'8px'}}><span className="help">Add spaces — tap a suggestion or type your own.</span>
      <div className="presets">${presets.map(p=>html`<button type="button" key=${p} className="opt" onClick=${()=>add(p)}>${p}</button>`)}</div>
      <div className="row" style=${{maxWidth:'460px'}}><input type="text" className="grow" placeholder="Custom space or zone, e.g. Prayer room" value=${custom} onChange=${e=>setCustom(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter'&&custom.trim()){ e.preventDefault(); add(custom.trim()); setCustom(''); } }}/>
      <button type="button" className="btn" disabled=${!custom.trim()} onClick=${()=>{ add(custom.trim()); setCustom(''); }}><${Icon} n="plus"/>Add</button></div></div>`}
    ${list.length===0&&html`<div className="drop">No spaces added yet.</div>`}
    ${list.map((s,i)=>{ const d=s.dims||{}; const isOpen=open===s.id; const answered=ROOM_FIELDS.filter(([k])=>!isEmpty(s[k])).length; return html`<div className="space" key=${s.id}>
      <div className="space-head">
        <input type="text" value=${s.name} disabled=${disabled} aria-label="Space name" onChange=${e=>upd(s.id,{name:e.target.value})}/>
        <span className="small muted num">${d.l||d.w?`${d.l||'?'} × ${d.w||'?'} m`:'No size yet'}${d.l||d.w?html` <span className=${'tag '+(d.status==='verified'?'ok':'est')}>${d.status==='verified'?'verified':'estimate'}</span>`:''}</span>
        <span className="small muted">${answered}/${ROOM_FIELDS.length}</span>
        ${!disabled&&html`<button type="button" className="icon-btn" aria-label="Move up" disabled=${i===0} onClick=${()=>mv(i,-1)}><${Icon} n="up"/></button>
        <button type="button" className="icon-btn" aria-label="Move down" disabled=${i===list.length-1} onClick=${()=>mv(i,1)}><${Icon} n="down"/></button>`}

        ${!disabled&&html`<button type="button" className="icon-btn" aria-label=${'Remove '+s.name} onClick=${()=>onChange(list.filter(x=>x.id!==s.id))}><${Icon} n="trash"/></button>`}
      </div>
      ${isOpen&&html`<div className="space-body"><div className="fgrid">
        <div className="field full"><span className="flabel">Approximate dimensions</span>
          <div className="measure"><input type="number" min="0" step="any" placeholder="Length" aria-label="Length in metres" value=${d.l||''} disabled=${disabled} onChange=${e=>upd(s.id,{dims:{...d,l:e.target.value}})}/><span className="muted">×</span>
          <input type="number" min="0" step="any" placeholder="Width" aria-label="Width in metres" value=${d.w||''} disabled=${disabled} onChange=${e=>upd(s.id,{dims:{...d,w:e.target.value}})}/><span className="muted">m</span>
          <div className="seg"><button type="button" data-v="tbc" aria-pressed=${d.status!=='verified'} disabled=${disabled} onClick=${()=>upd(s.id,{dims:{...d,status:'estimate'}})}>Estimate</button><button type="button" aria-pressed=${d.status==='verified'} disabled=${disabled||!designer} onClick=${()=>upd(s.id,{dims:{...d,status:'verified'}})}>Verified on site</button></div></div></div>
        ${ROOM_FIELDS.map(([k,l,t,x])=>html`<div className=${'field'+(t==='textarea'?'':' ')} key=${k}><label htmlFor=${s.id+k}>${l}</label>
          ${t==='number'?html`<input id=${s.id+k} type="number" min="0" value=${s[k]||''} disabled=${disabled} onChange=${e=>upd(s.id,{[k]:e.target.value})}/>`
           :t==='radio'?html`<${Radio} opts=${x} value=${s[k]} disabled=${disabled} name=${l} onChange=${v=>upd(s.id,{[k]:v})}/>`
           :html`<textarea id=${s.id+k} rows="2" placeholder=${x||''} value=${s[k]||''} disabled=${disabled} onChange=${e=>upd(s.id,{[k]:e.target.value})}></textarea>`}</div>`)}
