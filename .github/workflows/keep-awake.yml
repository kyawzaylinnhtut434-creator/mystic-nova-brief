   name: Keep database awake

   on:
     schedule:
       - cron: '23 2 */3 * *'
     workflow_dispatch:

   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Visit the database
           run: |
             URL=$(grep -oE "supabaseUrl: *'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
             KEY=$(grep -oE "supabaseAnonKey: *'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
             if [ -z "$URL" ] || echo "$URL$KEY" | grep -q "YOUR-"; then
               echo "config.js is not set up yet - nothing to do."
               exit 0
             fi
             curl -fsS "$URL/rest/v1/settings?select=id&limit=1" -H "apikey: $KEY" > /dev/null
             echo "Database visited."
